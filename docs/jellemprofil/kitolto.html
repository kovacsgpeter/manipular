<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jellemprofil kitöltő</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --card: #f3f2ee;
  --border: #dedcd5;
  --grid: #d6d4cd;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #74726c;
  --mature: #2a78d6;
  --distorted: #eb6834;
  --serious: #c2410c;
  --notice: #fff4e5;
  --notice-border: #f0c48a;
  --focus: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19;
    --card: #242422;
    --border: #3b3a37;
    --grid: #3d3c39;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #9c9b93;
    --mature: #3987e5;
    --distorted: #d95926;
    --serious: #ec835a;
    --notice: #33261a;
    --notice-border: #7a4b22;
    --focus: #6da7ec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --card: #242422;
  --border: #3b3a37;
  --grid: #3d3c39;
  --text: #ffffff;
  --text-2: #c3c2b7;
  --muted: #9c9b93;
  --mature: #3987e5;
  --distorted: #d95926;
  --serious: #ec835a;
  --notice: #33261a;
  --notice-border: #7a4b22;
  --focus: #6da7ec;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--text);
  font: 16px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 1.35rem; line-height: 1.25; margin: 32px 0 8px; }
h3 { font-size: 1.1rem; margin: 24px 0 8px; }
h1:focus, h2:focus { outline: none; }
p { margin: 8px 0; }
.lead { color: var(--text-2); }
.small { font-size: 0.875rem; color: var(--text-2); }
.topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px; }
.topbar .brand { font-weight: 650; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 16px 0; }
.notice { background: var(--notice); border: 1px solid var(--notice-border); border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
.notice strong { color: var(--text); }
.icon-warn { color: var(--serious); font-weight: 700; }
label.field { display: block; font-weight: 600; margin: 16px 0 4px; }
input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
}
textarea { min-height: 96px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; }
.check input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
button, .button {
  font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 16px; cursor: pointer;
  border: 1px solid var(--text); background: var(--text); color: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
}
button.secondary, .button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
.progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
.progress > div { height: 100%; background: var(--text); }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.item { border-top: 1px solid var(--border); padding: 16px 0; }
.item legend { font-weight: 500; margin-bottom: 10px; padding: 0; }
.item .num { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.likert label { position: relative; }
.likert input, .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.likert span {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  min-height: 52px; padding: 6px 2px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  font-size: 0.75rem; color: var(--text-2); line-height: 1.2;
}
.likert span b { font-size: 1.05rem; color: var(--text); }
.likert input:checked + span { background: var(--text); border-color: var(--text); color: var(--surface); }
.likert input:checked + span b { color: var(--surface); }
.likert input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.scale-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.875rem; color: var(--text-2); margin: 8px 0; padding: 0; list-style: none; }

.scenario { border-top: 1px solid var(--border); padding: 16px 0; }
.scenario .stem { font-weight: 600; margin-bottom: 12px; }
.option { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin: 8px 0; }
.option p { margin: 0 0 10px; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choice { position: relative; }
.choice span { display: inline-block; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; font-size: 0.875rem; cursor: pointer; }
.choice input:checked + span { background: var(--text); color: var(--surface); border-color: var(--text); }
.choice input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

.qlist { padding-left: 20px; }
.qlist li { margin: 8px 0; }
.qlabel { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
details { margin: 12px 0; }
summary { cursor: pointer; font-weight: 600; }
.score-row { margin: 16px 0; }
.score-row .likert span { min-height: 40px; }

.radar-wrap { position: relative; max-width: 560px; margin: 8px auto; }
.radar-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.grid { fill: none; stroke: var(--grid); stroke-width: 1; }
.area-e { fill: var(--mature); fill-opacity: 0.14; stroke: var(--mature); stroke-width: 2; stroke-linejoin: round; }
.area-t { fill: var(--distorted); fill-opacity: 0.08; stroke: var(--distorted); stroke-width: 2; stroke-dasharray: 6 4; stroke-linejoin: round; }
.mk-e { fill: var(--mature); stroke: var(--surface); stroke-width: 2; }
.mk-t { fill: var(--distorted); stroke: var(--surface); stroke-width: 2; }
.hit { stroke: transparent; stroke-width: 28; pointer-events: stroke; }
.tick { fill: var(--muted); }
.lt { font-weight: 600; fill: var(--text); }
.ls { fill: var(--text-2); }
.flag { fill: var(--serious); }
.lbl.click { cursor: pointer; }
.lbl.click:hover .lt, .lbl.sel .lt { text-decoration: underline; }
.lbl:focus { outline: none; }
.lbl:focus-visible .lt { text-decoration: underline; fill: var(--focus); }
.tip {
  position: absolute; pointer-events: none; z-index: 2; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 0.8125rem;
  box-shadow: 0 2px 8px rgb(0 0 0 / 15%); white-space: nowrap; transform: translate(-50%, calc(-100% - 12px));
}
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; list-style: none; padding: 0; margin: 8px 0; font-size: 0.875rem; color: var(--text-2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.tabs button { padding: 6px 12px; font-size: 0.875rem; }
.tabs button[aria-pressed="false"] { background: transparent; color: var(--text); border-color: var(--border); }

.table-scroll { overflow-x: auto; margin: 12px 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 8px 0; }
.chips li { border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 0.875rem; }
.chips .why { color: var(--muted); }
.select-grid { columns: 2 240px; column-gap: 24px; }
.select-grid h4 { margin: 12px 0 4px; font-size: 0.9rem; break-after: avoid; }
.select-grid label { display: flex; gap: 8px; align-items: flex-start; font-size: 0.875rem; margin: 4px 0; break-inside: avoid; }
.hint { font-size: 0.875rem; color: var(--text-2); }
</style>
</head>

<script id="kerdesbank" type="application/json">{"schema":"jellemprofil-kerdesbank/1","version":"2026-09-28","audience":"hívő kitöltők","scale":{"1":"egyáltalán nem jellemző rám","2":"kevéssé jellemző","3":"részben jellemző","4":"nagyrészt jellemző","5":"teljesen jellemző rám"},"radarOrder":["IST","ELH","ELO","OLD","HAT","FEL"],"axes":[{"id":"ELO","name":"Előre","direction":"Előre","meaning":"Elindít, vállal, áttör és teret nyer."},{"id":"HAT","name":"Hátra","direction":"Hátra","meaning":"Megtart, véd, kitart és uralkodik önmagán."},{"id":"OLD","name":"Oldalra","direction":"Oldalra","meaning":"Új nézőpontot, kapcsolatot vagy kerülőutat talál."},{"id":"IST","name":"Istenhez igazodás","direction":"Felfelé","meaning":"Istenhez igazodás: hit, ima és engedelmesség."},{"id":"ELH","name":"Elhívás","direction":"Felfelé","meaning":"Magasabb cél, jövőkép és elhívás felismerése."},{"id":"FEL","name":"Mások felemelése","direction":"Felfelé","meaning":"Mások felemelése, vezetése és felhatalmazása."}],"pairs":[{"id":"ELO-1","axis":"ELO","mature":"Kezdeményezés","distorted":"Impulzivitás","r1":{"E":"Ha látom, hogy valamit el kellene kezdeni, nem várok másra, hanem elindítom.","T":"Amikor lelkes vagyok valamiért, gyakran belevágok, mielőtt végiggondolnám a következményeket."},"interview":{"main":"Mesélj egy helyzetről az elmúlt egy évből, amikor te indítottál el valamit, amit senki más nem kezdett el. Hogyan döntötted el, hogy belevágsz?","stress":"Mesélj egy esetről, amikor lelkesedésből belevágtál valamibe, és utólag kiderült, hogy korai volt. Mi történt?","others":"Ha a közeli munkatársaidat vagy családtagjaidat kérdezném, azt mondanák, hogy inkább túl hamar vagy túl későn vágsz bele a dolgokba?","signsE":["Elindít, de előtte röviden felméri a helyzetet és a szükséges erőforrást.","Másokat is bevon, nem egyedül rohan előre."],"signsT":["Ismétlődő minta: belevágás, majd félbehagyás vagy utólagos kármentés.","A végiggondolást elvesztegetett időnek tartja."]},"sjt":[{"stem":"A gyülekezetben régóta szó van róla, hogy kellene egy ifjúsági alkalom, de senki nem lép.","E":"Felvetem a vezetőknek, hogy szívesen elindítanám, és kérek egy hetet, hogy összeírjam, mi kell hozzá.","T":"Még aznap kiírom a csoportba, hogy jövő pénteken indul, a részleteket majd menet közben kitaláljuk.","H":"Megvárom, amíg valaki felelősként elindítja, és akkor szívesen besegítek."},{"stem":"A munkahelyeden észreveszel egy folyamatot, ami sok időt pazarol. Senki sem kérte, hogy foglalkozz vele.","E":"Kidolgozok egy rövid javaslatot, és megbeszélem a felettesemmel, mielőtt bármit változtatnék.","T":"Holnaptól a saját részemen máshogy csinálom, a többiek majd alkalmazkodnak.","H":"Nem az én feladatom; ha zavarna valakit, már szóvá tette volna."},{"stem":"Egy barátod felveti, hogy induljatok el együtt egy jótékonysági futáson két hónap múlva.","E":"Megnézem a naptáramat és a formámat, és ha belefér, jelentkezem, meg készítünk edzéstervet.","T":"Azonnal benevezek mindkettőnket, meg még két ismerőst is, majd kiderül, hogyan készülünk.","H":"Azt mondom, jó ötlet, de inkább majd jövőre, ha több időm lesz."}]},{"id":"ELO-2","axis":"ELO","mature":"Bátorság","distorted":"Vakmerőség","r1":{"E":"Kiállok egy fontos ügy mellett akkor is, ha ez kényelmetlenséggel vagy kockázattal jár számomra.","T":"Előfordul, hogy olyan kockázatot vállalok, amelyről utólag belátom, hogy felelőtlen volt."},"interview":{"main":"Mesélj egy helyzetről, amikor kiálltál valami mellett, és ez kockázattal vagy kellemetlenséggel járt számodra.","stress":"Volt olyan, hogy utólag beláttad: egy vállalt kockázat felelőtlen volt, és másokat is érintett? Mi vitt bele?","others":"Mit mondanának rólad: inkább óvatos vagy, vagy inkább hajlamos vagy fejjel a falnak menni?","signsE":["A félelmet elismeri, és mégis cselekszik egy fontos érték miatt.","A kockázatot felméri, és vállalja a következményeit."],"signsT":["A kockázat izgalma vonzza, nem az ügy.","Mások biztonságát vagy érdekét nem mérlegeli."]},"sjt":[{"stem":"Egy megbeszélésen a vezető olyan döntést jelent be, amelyről tudod, hogy igazságtalan egy kollégával szemben.","E":"A megbeszélés után négyszemközt jelzem neki a véleményemet, konkrét érvekkel.","T":"Ott helyben, mindenki előtt nekimegyek, hogy ez így nem mehet.","H":"Nem szólok, mert úgysem változtatna semmin, csak magamnak ártanék."},{"stem":"Egy túrán te vezeted a csoportot. Sötétedés előtt a csapat a rövidebb, de nehezen járható úton menne vissza.","E":"Felmérem, mindenki bírja-e, és ha van kétség, a hosszabb, biztos utat választom, akkor is, ha ez morgással jár.","T":"Megyünk a rövidebben, eddig is megoldottuk az ilyet, ne legyünk ennyire gyávák.","H":"Átadom a döntést annak, aki jobban ismeri a terepet, hogy ne rajtam múljon."},{"stem":"Felajánlanak egy új szolgálati lehetőséget egy másik városban, ami bizonytalan anyagi helyzettel jár.","E":"Imádságban és a családommal végiggondolom, beszélek tapasztalt emberekkel, és ha megerősítést kapok, vállalom a bizonytalanságot.","T":"Ha jónak érzem, azonnal igent mondok, az anyagiak majd megoldódnak valahogy.","H":"Megköszönöm, de nemet mondok, mert nem szeretném kockáztatni azt, amit eddig felépítettem."}]},{"id":"ELO-3","axis":"ELO","mature":"Hódítás","distorted":"Agresszió vagy uralkodás","r1":{"E":"Szívesen lépek be új területre (munkában, kapcsolatokban, szolgálatban), és ott teret nyerek.","T":"Ha teret akarok nyerni egy helyzetben, előfordul, hogy mások rovására teszem, vagy leszorítom őket."},"interview":{"main":"Mesélj egy helyzetről, amikor egy új területen (munkában, kapcsolatban, szolgálatban) teret nyertél. Mit csináltál, hogy ott megvesd a lábad?","stress":"Volt olyan, hogy a térnyerésed valakinek a háttérbe szorulásával járt? Hogyan élte meg ő, és hogyan te?","others":"Akik veled dolgoznak, érzik-e úgy néha, hogy melletted nem jut nekik elég hely?","signsE":["Új területet nyit, és közben kapcsolatot épít az ott lévőkkel.","Teret szerez úgy, hogy másoknak is marad hely."],"signsT":["Versenyként éli meg a helyzeteket, ahol másnak vesztenie kell.","Leszorítja vagy kiszorítja azokat, akik előtte ott voltak."]},"sjt":[{"stem":"Új csapatba kerülsz, ahol egy régi tag viszi a legfontosabb projektet, szerinted nem túl jól.","E":"Megismerem a projektet, felajánlom a segítségemet, és apránként olyan részt vállalok, amelyben megmutathatom, mit tudok.","T":"Megmutatom a vezetőnek, hogy én jobban csinálnám, és elérem, hogy rám bízzák.","H":"Hagyom, hogy ő vigye, én csak a kiosztott feladataimat csinálom."},{"stem":"A gyülekezetben elindítanál egy új szolgálati ágat, de egy hasonló kör már működik, kevés sikerrel.","E":"Leülök a kör vezetőjével, és megbeszéljük, hogyan tudnánk együtt vagy egymást kiegészítve továbblépni.","T":"Elindítom a sajátomat, a jobb kör majd magától elszívja az embereket a másiktól.","H":"Leteszek róla, hiszen már van ilyen kör, nem akarok konkurenciát."},{"stem":"Egy vitában érzed, hogy igazad van, és a társaság is feléd hajlik, de a másik fél még érvel.","E":"Még egyszer nyugodtan összefoglalom az érveimet, és meghallgatom az övéit is.","T":"Addig nyomom, amíg a másik fel nem adja, hadd lássa mindenki, ki nyert.","H":"Ráhagyom, nem éri meg vitatkozni."}]},{"id":"ELO-4","axis":"ELO","mature":"Határozottság","distorted":"Erőszakosság","r1":{"E":"Ha meghoztam egy döntést, egyértelműen képviselem, és nem inogok meg minden ellenvetésnél.","T":"Ha sietni kell, vagy nem értenek egyet velem, hajlamos vagyok rákényszeríteni másokra a döntésemet."},"interview":{"main":"Mesélj egy nehéz döntésről, amelyet meghoztál, és akkor is képviseltél, amikor ellenvetések jöttek.","stress":"Mi történik veled, amikor sürget az idő, és a többiek nem értenek egyet a döntéseddel? Mesélj egy konkrét esetet.","others":"Mondták már neked, hogy lehengerlő vagy, vagy hogy nem hagysz teret másoknak a döntésben?","signsE":["Meghallgatja az ellenvetéseket, utána világosan kimondja a döntést.","Akkor is kitart, ha a döntés népszerűtlen, de megindokolja."],"signsT":["Az ellenvetést személyes támadásnak veszi, vagy elhallgattatja.","Nyomás alatt hangerővel, fenyegetéssel, ultimátummal dönt."]},"sjt":[{"stem":"Családi program szervezésekor mindenki mást akar, és fogy az idő a foglalásra.","E":"Még egyszer röviden meghallgatok mindenkit, aztán döntök, és elmondom, miért ez lett.","T":"Szólok, hogy ennyi volt a vita, lefoglalom, amit én jónak látok, és aki nem jön, az nem jön.","H":"Várok, hátha valaki más dönt, és ha lejár a foglalás, majd keresünk mást."},{"stem":"Csoportvezetőként meghoztál egy döntést, de a csoport két tagja nyíltan elégedetlen vele.","E":"Meghallgatom az érveiket; ha nincs új szempont, maradok a döntésnél, és elmondom, mire számíthatnak.","T":"Közlöm, hogy a döntés nem vita tárgya, és aki nem tud vele együtt dolgozni, keressen mást.","H":"Visszavonom a döntést, és megkérem őket, hogy találjanak ki jobbat."},{"stem":"Egy közös projektben a társad lassan dönt, és emiatt csúsztok.","E":"Megbeszélem vele, hogy adjunk magunknak határidőt, és ha addig nincs döntés, én döntök.","T":"Ettől kezdve egyszerűen megkerülöm, és én döntök helyette, előtte szólni sem szólok.","H":"Várok, ő a felelős, én nem akarok beleszólni."}]},{"id":"ELO-5","axis":"ELO","mature":"Ambíció","distorted":"Törtetés","r1":{"E":"Vannak nagy céljaim, és kész vagyok sokat dolgozni az elérésükért.","T":"Ha a céljaimról van szó, előfordul, hogy átlépek emberek érzésein vagy érdekein."},"interview":{"main":"Mesélj egy nagy célodról, amiért sokat dolgoztál. Mit adtál fel érte, és mit nem voltál hajlandó feladni?","stress":"Volt olyan, hogy a céljaid érdekében átléptél valakinek az érdekein vagy érzésein? Hogyan látod ezt ma?","others":"Akik veled versenyhelyzetben voltak, hogyan jellemeznének?","signsE":["Magas célokat tűz ki, és kitartóan, tisztességesen dolgozik értük.","A siker mellett a kapcsolatai és az értékei is fontosak maradnak."],"signsT":["Az embereket eszközként kezeli a cél elérésében.","Mások sikerét fenyegetésként éli meg."]},"sjt":[{"stem":"Megnyílik egy vezetői pozíció, amelyre egy közeli kollégád is pályázik.","E":"Jelentkezem, ezt nyíltan megmondom neki is, és a legjobb formámat hozom a kiválasztáson.","T":"Jelentkezem, és a vezetőnél elejtek néhány megjegyzést a kollégám gyengeségeiről.","H":"Nem jelentkezem, mert nem akarok versenyezni vele."},{"stem":"Egy projektben a te ötleted hozta a sikert, de a prezentációt a csapat egy másik tagja tartja.","E":"Örülök a közös sikernek, és ha szóba kerül, elmondom, mi volt az én részem.","T":"Gondoskodom róla, hogy a vezetőség tudja: az ötlet valójában az enyém volt.","H":"Nem szólok semmit, úgyis mindegy, kié az ötlet."},{"stem":"Egy hosszú távú célod (például egy szakmai vizsga) miatt hónapok óta kevés időd jut a családra.","E":"Leülünk, megbeszéljük, mennyi időt kér még a cél, és közösen kijelöljük, mit nem áldozok fel érte.","T":"Elmagyarázom nekik, hogy ez most fontosabb, és türelmesnek kell lenniük, amíg el nem érem.","H":"Feladom a célt, úgysem vagyok elég jó ahhoz, hogy sikerüljön."}]},{"id":"HAT-1","axis":"HAT","mature":"Kitartás","distorted":"Makacsság","r1":{"E":"Ha elkezdtem valamit, akkor is végigviszem, amikor már nehéz, és elfogyott a lelkesedés.","T":"Nehezen engedek el egy elképzelést akkor is, ha a körülmények vagy mások érvei már egyértelműen mást mutatnak."},"interview":{"main":"Mesélj valamiről, amit akkor is végigvittél, amikor már nagyon nehéz volt, és elfogyott a lelkesedésed.","stress":"Volt olyan, hogy túl sokáig ragaszkodtál egy elképzeléshez, pedig a jelek már mást mutattak? Mikor és hogyan engedted el?","others":"Ha a hozzád közel állókat kérdezném: inkább kitartó vagy, vagy inkább nehéz téged meggyőzni?","signsE":["Nehézségek közt is kitart, de időnként felülvizsgálja, érdemes-e.","Az ellenérveket komolyan veszi."],"signsT":["A változtatást kudarcként vagy vereségként éli meg.","Presztízsből ragaszkodik, nem a cél miatt."]},"sjt":[{"stem":"Fél éve tanulsz egy hangszeren, és az utóbbi hetekben úgy érzed, semmit sem fejlődsz.","E":"Folytatom, de visszajelzést kérek a tanáromtól, és ha kell, változtatok a gyakorlás módján.","T":"Ugyanúgy folytatom, ahogy eddig, előbb-utóbb be kell jönnie.","H":"Abbahagyom, úgy tűnik, ez nem nekem való."},{"stem":"Egy projektben a csapat többsége szerint a te megoldásod nem működik, és bizonyítékot is hoznak.","E":"Átnézem a bizonyítékot, és ha meggyőző, beállok az új megoldás mögé.","T":"Kitartok a megoldásom mellett, a bizonyítékuk biztosan hiányos.","H":"Rögtön elengedem, nem akarok vitát."},{"stem":"Egy megromlott barátságot évek óta próbálsz helyrehozni, de a másik fél alig reagál.","E":"Jelzem neki, hogy nyitott vagyok, de nem erőltetem tovább, és imádságban elengedem az eredményt.","T":"Továbbra is keresem, üzenek, hívom, mert nem adom fel, akármit mond.","H":"Egyszerűen nem keresem többé, és igyekszem nem is gondolni rá."}]},{"id":"HAT-2","axis":"HAT","mature":"Védelem","distorted":"Kontrollálás","r1":{"E":"Tudatosan őrzöm, ami rám van bízva (család, közösség, értékek, erőforrások).","T":"Amikor aggódom valami miatt, igyekszem mindent és mindenkit a saját kezemben tartani."},"interview":{"main":"Mesélj egy helyzetről, amikor valamit vagy valakit, ami rád volt bízva, meg kellett védened.","stress":"Mi történik veled, amikor aggódsz valakiért vagy valamiért? Mesélj egy esetet, amikor emiatt mindent a kezedben akartál tartani.","others":"Mondta már valaki, hogy túlféltesz vagy túlellenőrzöl?","signsE":["Határozottan véd, de a védettnek mozgásteret hagy.","A veszélyre arányosan reagál."],"signsT":["Aggodalomból folyamatosan ellenőriz, információt kér.","Nehezen viseli, ha valami a látókörén kívül történik."]},"sjt":[{"stem":"A 16 éves gyermeked először megy el barátokkal egy többnapos kirándulásra.","E":"Megbeszéljük a szabályokat és az elérhetőséget, aztán megbízom benne, és elengedem.","T":"Kérem, hogy óránként jelentkezzen, és a barátai szüleinek is megírom a számomat.","H":"Elengedem, a részletekbe nem kérdezek bele, úgyis megoldja."},{"stem":"Rád bízták a közösség pénzügyeit, és egy új önkéntes szeretne besegíteni.","E":"Betanítom, átadok neki egy jól körülhatárolt részt, és rendszeresen átnézzük együtt.","T":"Megköszönöm, de inkább mindent én csinálok, mert így biztos, hogy nem lesz hiba.","H":"Átadom neki az egészet, és nem is foglalkozom vele többet."},{"stem":"Egy csapattagodat igazságtalanul kritizálja egy másik részleg vezetője.","E":"Kiállok mellette, tisztázom a tényeket a vezetővel, és utána elmondom a csapattagnak, mi történt.","T":"Ettől kezdve minden kommunikációt én bonyolítok a részleggel, a csapattagom oda sem szólhat.","H":"Hagyom, hogy maga intézze el, felnőtt ember."}]},{"id":"HAT-3","axis":"HAT","mature":"Türelem","distorted":"Passzivitás","r1":{"E":"Tudok várni a gyümölcsre anélkül, hogy feladnám vagy siettetném a dolgokat.","T":"Előfordul, hogy nálam a „türelem” valójában azt jelenti, hogy halogatom a szükséges lépést."},"interview":{"main":"Mesélj egy helyzetről, amikor sokáig kellett várnod valaminek a gyümölcsére. Mi segített kitartani?","stress":"Volt olyan, hogy a várakozásod valójában halogatás volt? Honnan vetted észre?","others":"Mit mondanának rólad: türelmes vagy, vagy inkább néha túl sokáig vársz?","signsE":["Aktívan vár: megteszi, ami rajta múlik, a többit hagyja beérni.","Meg tudja különböztetni a várakozást a halogatástól."],"signsT":["A türelem mögött konfliktuskerülés vagy félelem áll.","Sorozatosan elmaradnak a szükséges lépések."]},"sjt":[{"stem":"Egy kolléga hetek óta nem küldi el azt az anyagot, ami nélkül nem tudsz haladni.","E":"Megkeresem, megbeszéljük, mi akadályozza, és közösen kijelölünk egy reális határidőt.","T":"Várok még, biztos sok a dolga, nem akarom siettetni.","H":"Szólok a főnökének, hogy intézze el ő."},{"stem":"Egy felújításnál a szakember csúszik, és a lakás hetek óta félkész állapotban van.","E":"Tartom vele a kapcsolatot, megbeszéljük az új ütemezést, és a köztes időben, amit tudok, magam elintézek.","T":"Nem szólok, majd jön, amikor jön; addig így élünk.","H":"Felhívom, és közlöm, hogy ha holnap nincs itt, keresek mást."},{"stem":"Egy új csapattagod lassabban tanul bele a munkába, mint amire számítottál.","E":"Adok neki még időt, és közben megnézem, miben tudnám jobban segíteni.","T":"Nem hozom szóba, hátha magától belejön; addig nem foglalkozom a kérdéssel.","H":"Szólok neki, hogy gyorsítania kell, különben keresünk mást."}]},{"id":"HAT-4","axis":"HAT","mature":"Önuralom","distorted":"Elfojtás","r1":{"E":"Erős érzelmi helyzetben is meg tudom választani, hogyan reagálok.","T":"A negatív érzéseimet (harag, szomorúság, csalódás) inkább magamba fojtom, mint hogy kimondjam vagy feldolgozzam."},"interview":{"main":"Mesélj egy helyzetről, amikor erős érzelmek (harag, félelem, sértettség) között is meg tudtad választani, hogyan reagálsz.","stress":"Mi történik a negatív érzéseiddel, miután egy helyzetben „megőrizted a nyugalmadat”? Hová kerülnek?","others":"Tudják-e a hozzád közel állók, ha haragszol vagy szomorú vagy?","signsE":["Érzékeli és meg tudja nevezni az érzést, a reakciót megválasztja.","Később, megfelelő helyen feldolgozza vagy kimondja."],"signsT":["Nem engedi meg magának az érzéseit, vagy nem is érzékeli őket.","A felgyűlt feszültség kitörésben, testi tünetben vagy visszahúzódásban jelenik meg."]},"sjt":[{"stem":"Egy családi ebéden egy rokonod bántó megjegyzést tesz rád mindenki előtt.","E":"Nyugodtan jelzem, hogy ez rosszul esett, és később négyszemközt megbeszélem vele.","T":"Mosolygok, mintha nem történt volna semmi, és soha nem hozom szóba.","H":"Visszavágok ugyanolyan élesen, hadd érezze ő is."},{"stem":"Egy hosszú, nehéz hét után a társad olyat mond, ami nagyon felidegesít.","E":"Szólok, hogy most fáradt és ideges vagyok, és kérek egy kis időt, mielőtt beszélünk róla.","T":"Lenyelem, nem akarok veszekedést, pedig napokig rágódom rajta.","H":"Kiabálok, aztán később bocsánatot kérek."},{"stem":"Egy gyülekezeti döntés mélyen csalódást okoz neked.","E":"Imádságban kimondom a csalódásomat, és megkeresem a döntéshozókat, hogy elmondjam a véleményemet.","T":"Azt mondom magamnak, hogy egy hívőnek nem szabad így éreznie, és igyekszem nem gondolni rá.","H":"Ott helyben hangot adok a felháborodásomnak."}]},{"id":"HAT-5","axis":"HAT","mature":"Hűség","distorted":"Változásképtelenség","r1":{"E":"Nehéz időszakokban is kitartok az emberek, közösségek és vállalások mellett.","T":"Akkor is ragaszkodom a megszokott formákhoz, szerepekhez, amikor már láthatóan változtatni kellene."},"interview":{"main":"Mesélj egy kapcsolatról, közösségről vagy vállalásról, amely mellett nehéz időszakban is kitartottál. Mi tartott ott?","stress":"Volt olyan, hogy egy megszokott forma, szerep vagy közösség mellett akkor is kitartottál, amikor már változtatni kellett volna? Mi tartott vissza?","others":"Mit mondanának rólad: megbízható társ vagy, vagy inkább nehezen mozdulsz, ha változni kell?","signsE":["Az emberekhez és az értékekhez hűséges, a formákban rugalmas.","Nehéz időkben is jelen van."],"signsT":["A változást árulásként éli meg.","Szerepekhez, megszokott formákhoz akkor is ragaszkodik, ha azok már nem szolgálnak."]},"sjt":[{"stem":"A közösség, ahová húsz éve jársz, új vezetést és az alkalmak új formáját kapja, ami idegen számodra.","E":"Maradok, időt adok a változásnak, és elmondom a vezetőknek, mi nehéz nekem benne.","T":"Kitartok amellett, hogy a régi forma volt a helyes, és a régiekkel továbbra is úgy csináljuk, ahogy eddig.","H":"Keresek egy másik közösséget, ahol jobban érzem magam."},{"stem":"Egy régi barátod élete nagyot változott (új meggyőződés, új életforma), és ez eltávolít titeket.","E":"Tartom vele a kapcsolatot, kíváncsi vagyok az új életére, és megkeressük az új közös pontokat.","T":"Azt várom tőle, hogy olyan legyen, mint régen, és ha nem az, szóvá is teszem.","H":"Hagyom, hogy a barátság lassan elhaljon, ez az élet rendje."},{"stem":"Egy munkahelyi feladatkört évek óta te viszel, és a vezetőség átszervezné a csapatot.","E":"Segítem az átmenetet, és átadom a tapasztalatomat, még ha nehéz is elengedni.","T":"Igyekszem meggyőzni őket, hogy maradjon minden úgy, ahogy van, mert így működik.","H":"Ha elveszik, hát elveszik; nem kötődöm hozzá, keresek mást."}]},{"id":"OLD-1","axis":"OLD","mature":"Rugalmasság","distorted":"Megalkuvás","r1":{"E":"Ha egy terv nem működik, gyorsan át tudok állni egy másik megoldásra.","T":"Nyomás alatt könnyen engedek olyan dolgokban is, amelyekben pedig ki kellene tartanom."},"interview":{"main":"Mesélj egy helyzetről, amikor egy terv nem működött, és gyorsan át kellett állnod valami másra.","stress":"Volt olyan, hogy nyomás alatt engedtél valamiben, amiben utólag úgy érzed, ki kellett volna tartanod?","others":"Ha a hozzád közel állókat kérdezném: rugalmas vagy, vagy néha túl könnyen engedsz?","signsE":["A módszerben rugalmas, a lényegben és az értékekben szilárd.","Tudja, miben nem enged."],"signsT":["A nyomás elől enged, nem azért, mert a helyzet változást kér.","Utólag rendszeresen megbánja, hogy igent mondott."]},"sjt":[{"stem":"Egy fontos családi esemény időpontját az utolsó pillanatban áttették, éppen oda, ahol a munkahelyeden is kritikus határidőd van.","E":"Megnézem, mit tudok átszervezni, egyeztetek a munkahelyemen, és keresem a módját, hogy mindkettő sikerüljön.","T":"Mindenre rábólintok, amit kérnek tőlem, és megpróbálom valahogy túlélni.","H":"Ragaszkodom az eredeti tervhez: aki áttette, az oldja meg."},{"stem":"Az ügyfeled olyan kiegészítést kér, ami már sérti a korábban lefektetett minőségi elveidet.","E":"Megkeresem azt a megoldást, amely kielégíti a kérése mögötti igényt, de nem sérti az elveimet.","T":"Megcsinálom, amit kér; az ügyfélnek mindig igaza van, és nem akarom elveszíteni.","H":"Nemet mondok, a szerződésben nem ez szerepelt."},{"stem":"A csoport, amelyben szolgálsz, olyan programot szeretne, amely szerinted nem illik a közösség értékeihez.","E":"Elmondom a fenntartásaimat, és javaslok egy olyan változatot, amelyben mindenki szempontja érvényesül.","T":"Nem szólok, mert mindenki lelkes, és nem akarok ünneprontó lenni.","H":"Kijelentem, hogy ebben nem veszek részt, és kész."}]},{"id":"OLD-2","axis":"OLD","mature":"Kreativitás","distorted":"Szabálykerülés","r1":{"E":"Elakadt helyzetben gyakran találok új, szokatlan megoldást.","T":"Ha egy szabály akadályoz, inkább megkeresem a kiskaput, mint hogy betartsam."},"interview":{"main":"Mesélj egy helyzetről, amikor egy elakadt problémára új, szokatlan megoldást találtál.","stress":"Volt olyan, hogy egy szabályt „kreatívan” kerültél meg, és utólag ez gondot okozott valakinek?","others":"Mondták már rólad, hogy a szabályok rád nem vonatkoznak?","signsE":["A szabályok keretein belül keres új megoldást, vagy nyíltan kezdeményezi a megváltoztatásukat.","Mások ötleteit is beépíti."],"signsT":["A szabályt akadálynak tekinti, amelyet ki kell játszani.","A kiskapu keresése mögött kényelem vagy saját előny áll."]},"sjt":[{"stem":"Egy pályázat határideje éjfélkor lejár, és rájössz, hogy hiányzik egy kötelező igazolás.","E":"Megkeresem a kiírót, leírom a helyzetet, és megkérdezem, pótolhatom-e utólag.","T":"Beadom egy korábbi, hasonló igazolással; talán nem veszik észre.","H":"Nem adom be, ezt most elszalasztottam."},{"stem":"A gyülekezeti alkalom évek óta ugyanúgy zajlik, és egyre kevesebben jönnek el.","E":"Összegyűjtök néhány új ötletet, és a vezetőkkel közösen kipróbáljuk az egyiket.","T":"A következő alkalmon, amelyet én vezetek, szó nélkül teljesen máshogy csinálom; utólag úgyis mindenki örülni fog.","H":"Így szokott lenni, én nem változtatnék rajta."},{"stem":"A munkahelyi költségelszámolás szabályai szerinted feleslegesen bonyolultak.","E":"Javaslatot teszek egy egyszerűbb eljárásra, és addig betartom a jelenlegit.","T":"A magam módján egyszerűsítem, összevonok tételeket, a lényeg úgyis stimmel.","H":"Betartom, és nem gondolkodom rajta: a szabály az szabály."}]},{"id":"OLD-3","axis":"OLD","mature":"Bölcs kerülőút","distorted":"Menekülés","r1":{"E":"Felismerem, ha egy akadályon nem átmenni kell, hanem okosan megkerülni.","T":"Ha egy helyzet konfliktussal vagy kellemetlenséggel jár, inkább kitérek előle, mint hogy szembenézzek vele."},"interview":{"main":"Mesélj egy helyzetről, amikor egy akadályon nem átmenni kellett, hanem okosan megkerülni. Honnan tudtad, hogy ez a bölcs út?","stress":"Mesélj egy konfliktusról, amely elől kitértél. Utólag nézve kerülőút volt, vagy menekülés?","others":"Mit mondanának rólad: szembenézel a kellemetlen dolgokkal, vagy inkább kitérsz előlük?","signsE":["A kerülőút célja az eredmény, nem a kellemetlenség elkerülése.","Ha kell, később visszatér a kérdéshez."],"signsT":["A nehéz beszélgetések rendszeresen elmaradnak.","Megindokolja magának, miért nem kell szembenéznie."]},"sjt":[{"stem":"Egy kollégával évek óta feszült a viszonyod, és most közös projektbe kerültök.","E":"Kezdeményezek egy beszélgetést, és megbeszéljük, hogyan tudunk jól együtt dolgozni.","T":"Megoldom, hogy minél kevesebbet kelljen vele közvetlenül érintkeznem, mindent e-mailben intézek.","H":"Az első megbeszélésen szóvá teszem a régi sérelmeimet, tiszta lappal akarok indulni."},{"stem":"Egy fontos kérést a vezetőd most biztosan elutasítana, mert rossz passzban van.","E":"Megvárom a megfelelő pillanatot, és addig összegyűjtöm az érveket, és előkészítek egy kisebb próbát.","T":"Inkább el sem kezdem, túl kockázatos szóba hozni.","H":"Most rögtön odamegyek, és megkérdezem, legyek túl rajta."},{"stem":"Egy családtagodnak meg kellene mondanod valamit, ami fájdalmas lesz neki.","E":"Átgondolom, mikor és hogyan tudom a legkíméletesebben elmondani, és megteszem.","T":"Halogatom, hátha kiderül magától, vagy más mondja el neki.","H":"Kimondom egyenesen, ahogy van, az igazság úgyis igazság."}]},{"id":"OLD-4","axis":"OLD","mature":"Diplomácia","distorted":"Manipuláció","r1":{"E":"Ellentétes felek között is meg tudom találni azt a hangot és megoldást, amelyet mindenki elfogad.","T":"Tárgyaláskor előfordul, hogy elhallgatok vagy kiszínezek információkat, hogy a nekem kedvező eredmény jöjjön ki."},"interview":{"main":"Mesélj egy helyzetről, amikor ellentétes felek között sikerült olyan megoldást találnod, amelyet mindenki elfogadott.","stress":"Volt olyan tárgyalásod, ahol valamit elhallgattál vagy kiszíneztél, hogy a neked kedvező eredmény jöjjön ki? Mi vitt rá?","others":"Ha a tárgyalópartnereidet kérdezném, átláthatónak vagy taktikusnak tartanak?","signsE":["Minden fél érdekét érti és ki is mondja.","Az információt nem torzítja, csak a hangnemet igazítja."],"signsT":["Az információ adagolását eszközként használja.","Az egyes feleknek mást mond, hogy mindenkit megnyerjen."]},"sjt":[{"stem":"Két csapattagod összeveszett, és mindketten tőled várnak igazságot.","E":"Leülök mindkettőjükkel, meghallgatom őket, és segítek megtalálni, mi a közös érdekük.","T":"Mindkettőnek négyszemközt azt mondom, hogy igazából neki van igaza, hogy megnyugodjanak.","H":"Kimaradok belőle, oldják meg egymás között."},{"stem":"Eladod a használt autódat, és tudod, hogy a klíma néha kihagy.","E":"Elmondom a vevőnek, és ennek megfelelően szabom meg az árat.","T":"Nem hozom szóba; ha nem kérdez rá, az az ő dolga.","H":"Inkább nem adom el, nem szeretek alkudozni."},{"stem":"Egy bizottságban a javaslatodat két tag ellenzi.","E":"Megkérdezem, mi a fenntartásuk, és ahol jogos, beépítem a javaslatba.","T":"Az ülés előtt külön-külön megkeresem a többieket, és úgy tálalom a két ellenző érveit, hogy gyengének tűnjenek.","H":"Visszavonom a javaslatot, nem akarok vitát."}]},{"id":"OLD-5","axis":"OLD","mature":"Alkalmazkodás","distorted":"Elvtelenség","r1":{"E":"Új közegben gyorsan megértem a szokásokat, és úgy illeszkedem be, hogy közben önmagam maradok.","T":"Előfordul, hogy különböző társaságokban egymásnak ellentmondó véleményt képviselek, hogy elfogadjanak."},"interview":{"main":"Mesélj egy helyzetről, amikor egy számodra új közegben kellett megtalálnod a helyed. Miben igazodtál, és miben maradtál önmagad?","stress":"Volt olyan, hogy különböző társaságokban egymásnak ellentmondó véleményt képviseltél, hogy elfogadjanak?","others":"Ha két különböző baráti köröd találkozna, ugyanazt az embert ismernék benned?","signsE":["A szokásokhoz igazodik, az értékeit megtartja.","Tapintatosan, de nyíltan vállalja a hitét és a véleményét."],"signsT":["A véleménye társaságról társaságra változik.","A konfliktus elkerülése fontosabb számára, mint a meggyőződése."]},"sjt":[{"stem":"Az új munkahelyeden a kollégák gyakran gúnyolódnak a hívő embereken.","E":"Barátságos vagyok velük, és ha szóba kerül, nyugodtan elmondom, hogy én is hívő vagyok.","T":"Nevetek velük, és inkább nem árulom el, hogy hívő vagyok.","H":"Kerülöm a társaságukat, ebédnél is egyedül ülök."},{"stem":"Egy baráti társaságban mindenki mást gondol egy közéleti kérdésről, mint te.","E":"Ha rákérdeznek, elmondom a véleményemet, és kíváncsi vagyok az övékére.","T":"Egyetértően bólogatok, pedig máshol éppen az ellenkezőjét szoktam mondani.","H":"Vitába szállok, és addig nem hagyom annyiban, amíg el nem mondtam mindent."},{"stem":"Külföldre költözöl, ahol a gyülekezet egészen más stílusú, mint amit megszoktál.","E":"Megtanulom az ottani szokásokat, részt veszek bennük, és közben megtartom a saját lelki gyakorlataimat.","T":"Mindent átveszek, amit ott csinálnak, hogy minél hamarabb befogadjanak, az is mindegy, miben hisznek.","H":"Keresek egy magyar gyülekezetet, ahol minden olyan, mint otthon."}]},{"id":"IST-1","axis":"IST","mature":"Engedelmesség","distorted":"Vak engedelmesség vagy legalizmus","r1":{"E":"Ha felismerem, mit kér tőlem Isten, akkor is megteszem, ha nem értem teljesen, vagy nehéz.","T":"Ha egy lelki vezető vagy egyházi szabály valamit előír, akkor is követem, ha a lelkiismeretem vagy a józan eszem mást mond."},"interview":{"main":"Mesélj egy helyzetről, amikor felismerted, mit kér tőled Isten, és megtetted, pedig nehéz volt, vagy nem értetted teljesen.","stress":"Volt olyan, hogy egy lelki vezető vagy egyházi szabály kedvéért a lelkiismereted ellen cselekedtél? Hogyan élted meg?","others":"Mit mondanának rólad a gyülekezetben: szabálykövető vagy, vagy inkább a szabályok mögötti szívet keresed?","signsE":["Az engedelmessége az Isten iránti bizalomból fakad, és kérdezni is mer.","Érti, miért fontos, amit tesz."],"signsT":["A szabálykövetés biztonságérzetet ad neki, a kérdezés fenyegetőnek tűnik.","Másokat is a szabályok betartásán mér."]},"sjt":[{"stem":"A gyülekezet vezetője azt kéri, hogy egy vitatott ügyről senki ne beszéljen kívülállókkal, pedig egy barátodnak éppen ebben lenne szüksége segítségre.","E":"Imádkozom, és megbeszélem a vezetővel a helyzetet, hogy megtaláljuk, hogyan segíthetek a barátomon.","T":"Betartom a kérést, akármi történik a barátommal: a vezetőnek engedelmeskedni kell.","H":"A saját belátásom szerint döntök, a vezető kérése nem köt."},{"stem":"Az egyik szomszédodnak sürgősen segítség kellene a költözéshez, pont az istentisztelet idejében.","E":"Végiggondolom, mi itt a szeretet útja, és ha tényleg nincs más, segítek neki, az alkalmat pedig máskor pótolom.","T":"Az istentisztelet az első, erről nem nyitok vitát; keressen mást.","H":"Nem gondolkodom rajta, azt csinálom, amihez éppen kedvem van."},{"stem":"Imádság közben erős belső késztetést érzel, hogy bocsáss meg valakinek, akire még haragszol.","E":"Megteszem az első lépést, még ha nehéz is, és kérem Isten segítségét, hogy a szívem is kövesse.","T":"Kimondom a megbocsátást, mert ez a kötelességem, de azzal, hogy mi van a szívemben, nem foglalkozom.","H":"Majd akkor bocsátok meg, ha tényleg érzem is."}]},{"id":"IST-2","axis":"IST","mature":"Hit","distorted":"Valóságtagadás","r1":{"E":"Nehéz helyzetben is számítok Isten munkájára, és ez erőt ad a cselekvéshez.","T":"Előfordul, hogy egy nyilvánvaló problémával (egészség, pénz, kapcsolat) azért nem foglalkozom, mert „Isten majd megoldja”."},"interview":{"main":"Mesélj egy nehéz helyzetről, amikor Istenre számítottál, és ez erőt adott a cselekvéshez.","stress":"Volt olyan, hogy egy valós problémával (egészség, pénz, kapcsolat) azért nem foglalkoztál, mert úgy gondoltad, Isten majd megoldja? Mi lett belőle?","others":"A hozzád közel állók szerint a hited inkább cselekvésre indít, vagy néha elrejt a problémák elől?","signsE":["A hit és a felelős cselekvés együtt jár nála.","Szembenéz a tényekkel, és közben bízik."],"signsT":["A kellemetlen tényeket a hitre hivatkozva nem veszi tudomásul.","A kételyt vagy a rossz hírt hitetlenségnek érzi."]},"sjt":[{"stem":"Az orvos komoly vizsgálatot javasol egy tünet miatt.","E":"Imádkozom érte, és elmegyek a vizsgálatra, mert Isten az orvosokon keresztül is munkálkodik.","T":"Imádkozom érte, és bízom benne, hogy Isten meggyógyít, ezért egyelőre nem megyek el.","H":"Nagyon aggódom, és folyamatosan a legrosszabbra gondolok."},{"stem":"A családi költségvetés már három hónapja mínuszos.","E":"Leülünk, átnézzük a kiadásokat, csökkentünk, ahol lehet, és közben imádkozunk a megoldásért.","T":"Nem aggódom, eddig is gondoskodott rólunk Isten, most is fog; nem kell ezen rágódni.","H":"Pánikba esem, éjjel nem alszom, és úgy érzem, mindent egyedül kell megoldanom."},{"stem":"Egy közeli barátod elmondja, hogy komoly kételyei vannak a hitben.","E":"Meghallgatom, együtt gondolkodom vele, és elmondom, nekem mi segített a saját kételyeimben.","T":"Azt mondom neki, hogy ezeket a gondolatokat el kell hessegetnie, és egyszerűen hinnie kell.","H":"Nem tudok mit mondani, mert őszintén nekem is vannak hasonló kérdéseim, ezért inkább témát váltok."}]},{"id":"IST-3","axis":"IST","mature":"Imádság","distorted":"Passzív várakozás","r1":{"E":"Rendszeresen imádkozom, és a fontos döntéseimet imádságban is végiggondolom.","T":"Előfordul, hogy imádkozom valamiért, de a rám eső lépést nem teszem meg, mert várom, hogy magától rendeződjön."},"interview":{"main":"Mesélj arról, hogyan imádkozol egy fontos döntés előtt. Mesélj egy konkrét döntést.","stress":"Volt olyan, hogy imádkoztál valamiért, de a rád eső lépést nem tetted meg, mert vártad, hogy magától rendeződjön?","others":"A hozzád közel állók szerint az imádság nálad cselekvéssel is jár?","signsE":["Rendszeres imaélete van, amely a döntéseibe és a cselekvésébe is beépül.","Az imádság után megteszi a rá eső lépést."],"signsT":["Az imát a cselekvés helyett használja.","„Még nem kaptam választ”: évekig tartó halogatás."]},"sjt":[{"stem":"Régóta imádkozol egy új munkahelyért.","E":"Továbbra is imádkozom érte, és közben rendszeresen küldök önéletrajzot, és érdeklődöm.","T":"Imádkozom, és várom, hogy Isten megnyissa az ajtót; ha ő akarja, keresni fognak.","H":"Már nem imádkozom érte, magam intézem."},{"stem":"Egy megromlott családi kapcsolatért imádkozol.","E":"Imádkozom, és keresem az alkalmat, hogy egy kis lépést tegyek a másik felé.","T":"Imádkozom érte, és várom, hogy Isten megváltoztassa a másik szívét.","H":"Nem imádkozom érte, úgysem fog változni."},{"stem":"Fontos döntés előtt állsz: elvállalj-e egy vezetői szolgálatot.","E":"Időt szánok az imára, tanácsot kérek tapasztalt hívőktől, és egy kijelölt határidőn belül döntök.","T":"Addig nem döntök, amíg nem kapok egyértelmű jelet, akármeddig tart is.","H":"Mérlegelem az előnyöket és a hátrányokat, és döntök; ehhez nincs szükség imádságra."}]},{"id":"IST-4","axis":"IST","mature":"Istenfélelem","distorted":"Emberektől vagy büntetéstől való félelem","r1":{"E":"A döntéseimben fontosabb számomra, mit gondol Isten, mint az, hogy mit szólnak az emberek.","T":"A hitéletemet gyakran inkább a büntetéstől vagy mások ítéletétől való félelem mozgatja, mint a szeretet."},"interview":{"main":"Mesélj egy döntésről, amikor fontosabb volt számodra, mit gondol Isten, mint az, hogy mit szólnak az emberek.","stress":"Amikor elbuksz, mi mozgat leginkább: a büntetéstől való félelem, a szégyen vagy a szeretet? Mesélj egy konkrét helyzetet.","others":"Mit mondanának rólad a legközelebbi hívő barátaid: a gyülekezetben inkább a szeretet vagy inkább a megfelelés hajt?","signsE":["Az istenképe tiszteletteljes, de bizalmon alapul.","Mások véleményétől függetlenül vállalja a meggyőződését."],"signsT":["Az istenképe büntető, szorongást kelt.","A megfelelés és a látszat fontosabb számára, mint a belső indíttatás."]},"sjt":[{"stem":"Elbuksz egy olyan dologban, amellyel régóta küzdesz.","E":"Bocsánatot kérek Istentől, elfogadom a bocsánatát, és továbblépek; ha kell, segítséget kérek.","T":"Napokig gyötör a bűntudat, és félek, hogy Isten megbüntet, ezért imádkozni sem merek.","H":"Nem foglalkozom vele sokat, mindenki hibázik."},{"stem":"A gyülekezetben elvárás egy bizonyos öltözködés, amelyet te nem tartasz lényegesnek.","E":"Ha fontos a közösségnek, tiszteletből betartom, de nem ettől érzem magam jobb vagy rosszabb hívőnek.","T":"Betartom, mert félek, mit gondolnának rólam, ha nem tartanám be.","H":"Úgy öltözöm, ahogy akarok, a többiek véleménye nem érdekel."},{"stem":"A főnököd arra kér, hogy egy jelentésben kicsit „szépítsd” a számokat.","E":"Tisztelettel nemet mondok, mert Isten előtt ezt nem tudnám vállalni, akkor sem, ha ennek ára van.","T":"Megteszem, mert félek, hogy elveszítem az állásomat.","H":"Megteszem, ez nem olyan nagy dolog, mindenki így csinálja."}]},{"id":"IST-5","axis":"IST","mature":"Alázat","distorted":"Önleértékelés","r1":{"E":"Könnyen elismerem, ha tévedtem, és szívesen tanulok másoktól.","T":"Gyakran érzem úgy, hogy amit csinálok, az nem ér sokat, és mások jobbak nálam."},"interview":{"main":"Mesélj egy helyzetről, amikor elismerted, hogy tévedtél, vagy tanultál valakitől, akitől nem vártad volna.","stress":"Előfordul, hogy úgy érzed, amit csinálsz, nem ér sokat? Mesélj egy helyzetet, amikor ez az érzés visszatartott valamitől.","others":"Mit mondanának rólad: alázatos vagy, vagy inkább túl keveset gondolsz magadról?","signsE":["Reálisan látja az erősségeit és a gyengeségeit.","A dicséretet és a kritikát is el tudja fogadni."],"signsT":["A dicséretet elhárítja, a kritikát túlzottan magára veszi.","Nem vállal feladatot, mert „mások jobbak”."]},"sjt":[{"stem":"Megdicsérnek egy szolgálatodért a gyülekezet előtt.","E":"Megköszönöm, örülök neki, és elmondom, kik segítettek.","T":"Zavarba jövök, és mondom, hogy igazán semmiség volt, bárki meg tudta volna csinálni.","H":"Örülök, és elmesélem, mennyi munkám volt benne."},{"stem":"Felkérnek, hogy tarts egy rövid tanítást a kiscsoportban.","E":"Elvállalom, felkészülök, és utána visszajelzést kérek.","T":"Visszautasítom, mert mások sokkal jobban értenek hozzá, mint én.","H":"Elvállalom; nem kell sokat készülnöm, ezt a témát jól ismerem."},{"stem":"Egy fiatalabb kolléga rámutat egy hibára a munkádban.","E":"Megköszönöm, kijavítom, és megkérdezem, mit látott még.","T":"Napokig azon rágódom, hogy még egy ilyen hibát sem vagyok képes észrevenni.","H":"Elmagyarázom neki, hogy ez nem hiba, csak ő nem érti a hátterét."}]},{"id":"ELH-1","axis":"ELH","mature":"Jövőkép","distorted":"Nagyzolás","r1":{"E":"Világos képem van arról, merre szeretnék haladni az életemben a következő években.","T":"Szívesen beszélek a nagy terveimről akkor is, ha a mostani lépéseim ezt még nem igazán támasztják alá."},"interview":{"main":"Milyen képed van arról, merre haladsz a következő 3–5 évben? Mit teszel ebből már most?","stress":"Volt olyan terved, amelyről sokat beszéltél, de nem valósult meg? Mi történt?","others":"A hozzád közel állók szerint a terveid reálisak, vagy inkább nagyra törők?","signsE":["A jövőképe konkrét lépésekre bomlik.","A terveit a mostani helyzetével összhangban fogalmazza meg."],"signsT":["A tervekről való beszéd helyettesíti a lépéseket.","A jövőkép a saját nagyságáról szól."]},"sjt":[{"stem":"Egy baráti beszélgetésen szóba kerül, ki mit szeretne elérni öt év múlva.","E":"Elmondom a célomat, és azt is, melyek az első lépések, amelyeket már megtettem.","T":"Elmesélem a nagy terveimet, amelyektől mindenki elámul, akkor is, ha még semmit nem tettem értük.","H":"Azt mondom, nem tervezek ennyire előre, majd meglátjuk."},{"stem":"Egy közösségi kezdeményezésnél megkérdezik tőled, szerinted hová juthat el két év alatt.","E":"Felvázolok egy ambiciózus, de elérhető célt, és megmondom, mi kell hozzá.","T":"Azt mondom, országos mozgalom lehet belőle, ha rám bízzák a vezetését.","H":"Nem szeretek jóslásokba bocsátkozni; csináljuk, aztán meglátjuk."},{"stem":"A mentorod megkérdezi, mi a víziód a saját szolgálatodról.","E":"Elmondom, mit látok, és megkérdezem, szerinte mi hiányzik belőle.","T":"Elmondom, hogy nagy dolgokra vagyok elhívva, csak még nem jött el az ideje.","H":"Bevallom, hogy nincs ilyen képem, csak csinálom, ami jön."}]},{"id":"ELH-2","axis":"ELH","mature":"Elhívástudat","distorted":"Messiáskomplexus","r1":{"E":"Tudom, mire hívott el Isten, és ez irányt ad a döntéseimnek.","T":"Előfordul, hogy úgy érzem: ha én nem teszem meg, senki sem fogja, és nélkülem a dolgok összeomlanának."},"interview":{"main":"Mire hívott el Isten? Mesélj egy döntésről, amelyben ez az elhívás irányt adott.","stress":"Volt olyan, hogy úgy érezted: ha te nem teszed meg, senki sem fogja, és nélküled összeomlanának a dolgok? Mi lett ennek a következménye rád és másokra nézve?","others":"Mit mondanának a társaid: tudsz feladatot átadni, vagy mindent magadra veszel?","signsE":["Az elhívását a saját helyén és a saját határain belül éli meg.","Másokat is elhívottnak lát."],"signsT":["Nélkülözhetetlennek érzi magát.","A kiégés határán is vállal, mert „nincs más”."]},"sjt":[{"stem":"Abban a szolgálatban, amelyet vezetsz, a kiégés közelébe kerültél.","E":"Szólok a vezetőknek, átadok feladatokat, és pihenőt kérek, mert tudom, hogy Isten műve nem rajtam múlik.","T":"Nem állhatok meg, mert nélkülem összeomlana az egész.","H":"Kilépek a szolgálatból, és utódot sem keresek."},{"stem":"Valaki más is jelentkezik egy olyan szolgálatra, amelyet eddig te végeztél.","E":"Örülök neki, bevezetem, és megbeszéljük, hogyan osztozzunk.","T":"Kételkedem benne, hogy ő ugyanúgy értené a lényeget, hiszen ezt a feladatot én kaptam Istentől.","H":"Átadom neki az egészet, nekem mindegy."},{"stem":"Egy barátod komoly válságban van, és te vagy az egyik, akihez fordul.","E":"Mellette vagyok, és segítek neki további segítőt (lelkigondozót, szakembert) is találni.","T":"Úgy érzem, csak én tudok neki igazán segíteni, ezért mindent félreteszek érte.","H":"Megmondom neki, hogy ezzel inkább egy szakemberhez forduljon."}]},{"id":"ELH-3","axis":"ELH","mature":"Reménység","distorted":"Ábrándozás","r1":{"E":"Nehéz időszakban is reménnyel nézek előre, és ez segít cselekedni.","T":"Sokat képzelgek arról, milyen lesz majd egyszer, közben a mai lépések elmaradnak."},"interview":{"main":"Mesélj egy nehéz időszakról, amikor a reménység segített cselekedni.","stress":"Mennyi időt töltesz azzal, hogy elképzeled, milyen lesz majd egyszer? Mi történik közben a mai teendőiddel?","others":"Szerintük a reménységed inkább erőt ad neked, vagy inkább álmodozásba ringat?","signsE":["A remény a jelenben is lépésekre indítja.","A jövő reménye mellett a mai nehézségeket is vállalja."],"signsT":["A képzelgés menedék a jelen elől.","Az „egyszer majd” helyettesíti a mai döntéseket."]},"sjt":[{"stem":"Régóta egyedülálló vagy, és szeretnél házastársat.","E":"Reménykedem, imádkozom, és közben nyitott vagyok új közösségekre, kapcsolatokra.","T":"Sokat képzelgek arról, milyen lesz a tökéletes társam, és várom, hogy egyszer megjelenjen.","H":"Már nem remélem, hogy megtalálom, és nem is foglalkozom a kérdéssel."},{"stem":"A munkahelyeden rossz a hangulat, és a cég nehéz helyzetben van.","E":"Bízom benne, hogy lesz kiút, és közben megteszem, ami rajtam múlik, hogy jobb legyen.","T":"Arról álmodozom, hogy egyszer saját cégem lesz, addig a mostanit csak túlélem.","H":"Úgy érzem, ennek rossz vége lesz, és nem is próbálok tenni semmit."},{"stem":"Krónikus betegséggel élsz, amely korlátoz a mindennapokban.","E":"Remélem a javulást, és közben megtanulom, hogyan élhetek teljes életet a korlátok között.","T":"Leginkább arra gondolok, milyen lesz, ha egyszer meggyógyulok; addig nem nagyon tervezek semmit.","H":"Úgy érzem, nincs mire várnom, és nehezen kelek fel reggelente."}]},{"id":"ELH-4","axis":"ELH","mature":"Céltudatosság","distorted":"Megszállottság","r1":{"E":"A céljaim felé haladva tudatosan választom meg, mire mondok igent és mire nemet.","T":"Ha egy cél megfog, képes vagyok mindent (pihenést, kapcsolatokat, egészséget) alárendelni neki."},"interview":{"main":"Mesélj egy célról, amelyért tudatosan megválasztottad, mire mondasz igent és mire nemet.","stress":"Volt olyan cél, amelynek mindent alárendeltél: pihenést, kapcsolatokat, egészséget? Mikor vetted észre, és mi lett az ára?","others":"A családod szerint vannak-e időszakok, amikor „nem lehet veled beszélni”, mert valami teljesen magával ragad?","signsE":["Fókuszált, de a pihenés és a kapcsolatok is helyet kapnak.","A célt időnként felülvizsgálja."],"signsT":["A cél mindent felülír, a határok eltűnnek.","A cél elérése után sem tud megállni."]},"sjt":[{"stem":"Maratonra készülsz, és a párod szerint túl sok időt töltesz edzéssel.","E":"Megbeszéljük, mennyi idő fér bele, és úgy alakítom az edzéstervet, hogy neki is jusson idő.","T":"Elmagyarázom neki, hogy most ez a legfontosabb, utána majd bepótoljuk.","H":"Inkább lemondom a versenyt, nem akarok feszültséget."},{"stem":"Egy héttel a projekted határideje előtt megbetegszel.","E":"Pihenek, szólok a csapatnak, és átütemezzük, amit lehet.","T":"Lázasan is éjszakákig dolgozom, a határidő szent.","H":"Leteszek az egészről, úgysem fog időben elkészülni."},{"stem":"Elértél egy nagy célt, amelyért évekig dolgoztál.","E":"Megünneplem, pihenek, és csak utána gondolkodom a következő lépésen.","T":"Másnap már a következő, még nagyobb célon dolgozom, nincs idő megállni.","H":"Üresnek érzem magam, és hónapokig nem tudok új célt kitűzni."}]},{"id":"ELH-5","axis":"ELH","mature":"Küldetéstudat","distorted":"Önigazolás","r1":{"E":"Érzem, hogy az életemnek küldetése van, és ez értelmet ad a hétköznapi munkámnak is.","T":"Ha kritikát kapok, hajlamos vagyok azzal védekezni, hogy én egy fontos küldetést végzek."},"interview":{"main":"Mi a küldetésed, és hogyan ad értelmet a hétköznapi munkádnak?","stress":"Mesélj egy helyzetről, amikor kritikát kaptál. Előfordult, hogy azzal védekeztél, hogy te egy fontos küldetést végzel?","others":"A környezeted szerint el tudod fogadni a szolgálatodat érő kritikát?","signsE":["A küldetés értelmet és kitartást ad neki, de nem teszi érinthetetlenné.","A kritikát a küldetés javára fordítja."],"signsT":["A küldetést pajzsként használja a kritikával szemben.","A saját hibáit a nagy cél nevében elnézi magának."]},"sjt":[{"stem":"Egy gyülekezeti tag szóvá teszi, hogy a szolgálatod közben durván beszéltél vele.","E":"Meghallgatom, bocsánatot kérek, és átgondolom, hogyan lehetnék máskor figyelmesebb.","T":"Elmagyarázom neki, hogy nagy nyomás alatt dolgozom egy fontos ügyért, ezt meg kell értenie.","H":"Úgy érzem, alkalmatlan vagyok erre a szolgálatra, és felmerül bennem, hogy abbahagyom."},{"stem":"A családod szerint az utóbbi időben a sok szolgálat miatt keveset vagy otthon.","E":"Komolyan veszem, és átgondolom, mit tudok elengedni, mert a család is a küldetésem része.","T":"Elmondom nekik, hogy ez Isten ügye, és ezzel áldozatok járnak.","H":"Igazat adok nekik, és mindent abbahagyok; úgysem látom, mi értelme volt."},{"stem":"A munkád monoton, és egy kolléga megkérdezi, miért csinálod mégis ilyen lelkesen.","E":"Elmondom, hogy számomra ez is szolgálat, és értelmet ad, hogy másoknak segít.","T":"Elmondom, hogy én magasabb célért dolgozom, nem úgy, mint a legtöbben itt.","H":"Megvonom a vállam: a pénzért, mint mindenki."}]},{"id":"FEL-1","axis":"FEL","mature":"Bátorítás","distorted":"Hízelgés","r1":{"E":"Észreveszem mások erősségeit, és konkrétan ki is mondom nekik.","T":"Előfordul, hogy azért dicsérek meg valakit, hogy jó benyomást keltsek, vagy elérjek nála valamit."},"interview":{"main":"Mesélj egy helyzetről, amikor valakinek meglátva az erősségét konkrétan bátorítottad. Mi lett a hatása?","stress":"Előfordult, hogy azért dicsértél meg valakit, hogy jó benyomást kelts, vagy elérj nála valamit? Mesélj egy ilyen esetet.","others":"Ha a munkatársaidat kérdezném, őszintének éreznék a dicséreteidet?","signsE":["A bátorítása konkrét, igaz, és a másik javát szolgálja.","Nehéz helyzetben is talál őszinte, bátorító szót."],"signsT":["A dicséret célja a saját előny vagy a konfliktus elkerülése.","Túlzó és általános, mindenkinek ugyanazt mondja."]},"sjt":[{"stem":"Egy csapattagod közepes munkát adott le, és bizonytalannak tűnik.","E":"Kiemelem, ami valóban jól sikerült, és megmondom, min lehet még javítani.","T":"Azt mondom, hogy nagyszerű lett, hogy jó kedve legyen.","H":"Nem mondok semmit, a munkája az ő felelőssége."},{"stem":"A vezetőd olyan döntést hozott, amellyel nem értesz teljesen egyet, és kikéri a véleményedet.","E":"Elmondom, mit tartok jónak benne, és azt is, miben látok kockázatot.","T":"Megdicsérem a döntést; jó, ha a vezető elégedett velem.","H":"Kitérő választ adok, nem szeretek véleményt mondani."},{"stem":"Egy barátod könyvet írt, és a véleményedet kéri.","E":"Elolvasom, elmondom, mi fogott meg benne, és őszintén azt is, ami nem.","T":"Csak dicsérem, hogy ne sértődjön meg, és ne romoljon el a barátságunk.","H":"Megmondom, hogy nem értek hozzá, és el sem olvasom."}]},{"id":"FEL-2","axis":"FEL","mature":"Szolgáló vezetés","distorted":"Atyáskodó kontroll","r1":{"E":"Vezetőként abban látom a feladatomat, hogy a rám bízottak növekedését szolgáljam.","T":"Ha valakiért felelős vagyok, nehezen hagyom, hogy maga döntsön, mert úgy érzem, én jobban tudom, mi jó neki."},"interview":{"main":"Mesélj egy helyzetről, amikor vezetőként a rád bízottak növekedését szolgáltad. Mit tettél?","stress":"Volt olyan, hogy valaki helyett döntöttél, mert úgy érezted, jobban tudod, mi jó neki? Hogyan reagált?","others":"A rád bízottak szerint kapnak tőled elég önállóságot?","signsE":["A vezetés célja a másik fejlődése, nem a saját kényelem vagy biztonság.","Engedi hibázni a másikat, és mellette marad."],"signsT":["„Én jobban tudom”: felülírja a másik döntéseit.","A segítsége függőséget tart fenn."]},"sjt":[{"stem":"A kiscsoportod egyik tagja olyan párkapcsolati döntést hoz, amelyet te rossznak tartasz.","E":"Egyszer elmondom neki a fenntartásaimat, aztán tiszteletben tartom a döntését, és mellette maradok.","T":"Addig beszélek vele, és ha kell, a családját is bevonom, amíg meg nem gondolja magát.","H":"Nem szólok semmit, ez az ő magánügye."},{"stem":"Egy új csapattagod máshogy oldja meg a feladatot, mint ahogy te szoktad.","E":"Megkérdezem, miért így csinálja; ha működik, hagyom, és tanulok belőle.","T":"Megmutatom neki a helyes módszert, és kérem, hogy ezentúl így csinálja.","H":"Nem érdekel, hogyan csinálja, csak legyen kész."},{"stem":"A gyermeked (vagy egy mentoráltad) egyetemet választ.","E":"Segítek neki végiggondolni a lehetőségeket, de a döntést rábízom.","T":"Megmondom, melyik a jó választás, és ha mást választ, nem támogatom anyagilag.","H":"Teljesen rábízom, nem szólok bele, és nem is kérdezem."}]},{"id":"FEL-3","axis":"FEL","mature":"Inspirálás","distorted":"Érzelmi manipuláció","r1":{"E":"Képes vagyok lelkesedést ébreszteni másokban egy közös cél iránt.","T":"Ha el akarok érni valamit, előfordul, hogy bűntudatot, félelmet vagy túlzott lelkesedést keltek másokban."},"interview":{"main":"Mesélj egy helyzetről, amikor lelkesedést ébresztettél másokban egy közös cél iránt. Hogyan csináltad?","stress":"Előfordult, hogy bűntudatot, félelmet vagy túlzott lelkesedést keltettél másokban, hogy elérj valamit? Mesélj egy esetet.","others":"Az emberek szabadnak érzik magukat, hogy nemet mondjanak neked?","signsE":["A lelkesítés a cél értékére épül, és meghagyja a nemet mondás szabadságát.","A nehézségekről is őszintén beszél."],"signsT":["Bűntudatot, félelmet vagy kötelességérzetet használ eszközként.","Az érzelmi hatás fontosabb számára, mint a tartalom."]},"sjt":[{"stem":"Önkénteseket keresel egy jótékonysági akcióhoz, de kevesen jelentkeznek.","E":"Elmesélem, kiknek segítünk, és mit jelentene nekik, majd megkérdezem, ki tudna jönni.","T":"Elmondom, hogy aki most nem jön, az cserben hagyja a rászorulókat, és nem igazi hívő.","H":"Kiteszem a jelentkezési lapot; aki akar, jelentkezik."},{"stem":"Egy gyülekezeti gyűjtésnél a cél még messze van.","E":"Beszámolok az eddigiekről, megköszönöm az adományokat, és elmondom, mit tudnánk még elérni.","T":"Megemlítem, hogy más gyülekezetek sokkal nagylelkűbbek, és Isten látja, ki mennyit ad.","H":"Nem szólok róla, majd összejön, ami összejön."},{"stem":"Szeretnéd, ha a családod elkísérne egy lelkigyakorlatra, de ők nem lelkesek.","E":"Elmondom, nekem miért fontos, és hogy örülnék, ha jönnének, de elfogadom, ha nem.","T":"Szomorúan közlöm, hogy nagyon rosszul esik, hogy ennyire nem fontos nekik, ami nekem fontos.","H":"Meg sem kérdezem őket, egyedül megyek."}]},{"id":"FEL-4","axis":"FEL","mature":"Tanítás","distorted":"Kioktatás","r1":{"E":"Szívesen és érthetően adom át, amit tudok, úgy, hogy a másik a saját útján fejlődjön.","T":"Előfordul, hogy akkor is magyarázni kezdek, amikor senki sem kérdezte, vagy a másik már érti."},"interview":{"main":"Mesélj egy helyzetről, amikor valakinek úgy adtál át valamit a tudásodból, hogy ő a saját útján fejlődjön.","stress":"Előfordul, hogy akkor is magyarázni kezdesz, amikor senki sem kérdezte? Hogyan szoktak erre reagálni?","others":"Mit mondanának rólad: jó tanító vagy, vagy néha kioktató?","signsE":["Kérdez, mielőtt magyaráz, és a másik tudásszintjéhez igazodik.","Hagyja, hogy a másik maga jöjjön rá a dolgokra."],"signsT":["Kéretlen tanácsok, „majd én megmondom” hangnem.","A tanítás a saját tudásának megmutatásáról szól."]},"sjt":[{"stem":"Egy fiatalabb hívő egy bibliai szakaszt másképp értelmez, mint te.","E":"Megkérdezem, hogyan jutott erre, és elmondom az én értelmezésemet is, hogy együtt gondolkodjunk.","T":"Részletesen elmagyarázom neki, hogyan kell ezt helyesen érteni.","H":"Nem szólok semmit, mindenki úgy érti, ahogy akarja."},{"stem":"Egy kolléga egy olyan programmal küszködik, amelyet te jól ismersz, de nem kért segítséget.","E":"Megkérdezem, segíthetek-e, és ha igen, úgy mutatom meg a lépéseket, hogy ő csinálja.","T":"Odahajolok, elmondom, hogy ezt teljesen rosszul csinálja, és megmutatom, hogyan kell.","H":"Nem szólok; ha segítség kell, majd kér."},{"stem":"Egy családi beszélgetésen valaki tévesen idéz egy történelmi tényt.","E":"Ha a beszélgetés szempontjából fontos, röviden, barátságosan kiegészítem.","T":"Kijavítom, és hozzáfűzök egy hosszabb magyarázatot a témáról.","H":"Hagyom, nem fontos."}]},{"id":"FEL-5","axis":"FEL","mature":"Felhatalmazás","distorted":"Felelősség áthárítása","r1":{"E":"Szívesen adok át felelősséget és döntési jogot másoknak, és közben mellettük maradok.","T":"Ha valami rosszul sül el, hajlamos vagyok a felelősséget arra hárítani, akire a feladatot bíztam."},"interview":{"main":"Mesélj egy helyzetről, amikor felelősséget és döntési jogot adtál át valakinek. Hogyan maradtál mellette?","stress":"Mi történik, amikor egy általad átadott feladat rosszul sül el? Mesélj egy esetet: kié lett a felelősség?","others":"Akiknek feladatot adsz át, úgy érzik, számíthatnak rád, ha baj van?","signsE":["Valódi döntési jogot ad át, és kudarc esetén is vállalja a közös felelősséget.","Támogatja azt, akire a feladatot bízta, de nem veszi vissza tőle."],"signsT":["A feladat átadása nála a teher lerakása, nem a másik felemelése.","Kudarc esetén a felelősséget arra hárítja, akire a feladatot bízta."]},"sjt":[{"stem":"Egy rendezvény egyik részét egy fiatal csapattagra bíztad, és a vendégek elégedetlenek voltak.","E":"A vendégek felé én vállalom a felelősséget, a csapattaggal pedig utólag átbeszéljük, mit tanultunk.","T":"Jelzem a vendégeknek, hogy ezt a részt nem én szerveztem.","H":"Legközelebb inkább mindent magam csinálok."},{"stem":"Egy nagy projektet kell elvégezned, és van egy tehetséges munkatársad.","E":"Átadok neki egy fontos részt döntési joggal, és hetente átbeszéljük, hogyan halad.","T":"Rábízom a legnehezebb részt, és ha nem sikerül, az az ő felelőssége lesz.","H":"Egyedül csinálom meg, az gyorsabb, mint elmagyarázni."},{"stem":"A kiscsoportod vezetését átadnád valakinek, mert más feladatot kaptál.","E":"Felkészítem, átadom a vezetést, és az első hónapokban elérhető vagyok, ha kérdése van.","T":"Átadom neki, és onnantól nem foglalkozom vele; ha szétesik, ő nem volt elég jó.","H":"Nem adom át, inkább csinálom mindkettőt, amíg bírom."}]}],"round1":{"instructions":"Az alábbi állítások a mindennapi viselkedésedről szólnak. Nincs jó vagy rossz válasz, és senki sem tökéletes: a kérdőív akkor segít, ha őszintén azt jelölöd, ami az elmúlt fél évben jellemző volt rád, nem azt, amilyen szeretnél lenni. Ne gondolkodj sokat egy-egy állításon, az első benyomás a legpontosabb.","controls":[{"id":"K1","type":"lie","text":"Soha nem voltam még irigy senkire."},{"id":"K2","type":"lie","text":"Amit megígérek, azt kivétel nélkül mindig betartom."},{"id":"K3","type":"consistency","reverseOf":"HAT-4T","text":"A negatív érzéseimet ki tudom mondani, és fel tudom dolgozni."},{"id":"K4","type":"lie","text":"Még soha nem mondtam olyat, amit utólag megbántam."},{"id":"K5","type":"consistency","reverseOf":"OLD-3T","text":"A kellemetlen beszélgetéseket akkor is felvállalom, ha legszívesebben elkerülném őket."},{"id":"K6","type":"consistency","reverseOf":"ELO-1É","text":"Inkább megvárom, hogy valaki más kezdje el a dolgokat."}],"order":["ELO-1É","HAT-1T","OLD-1É","IST-1T","ELH-1É","FEL-1T","ELO-2É","HAT-2T","OLD-2É","IST-2T","ELH-2É","FEL-2T","K1","ELO-3É","HAT-3T","OLD-3É","IST-3T","ELH-3É","FEL-3T","ELO-4É","HAT-4T","OLD-4É","IST-4T","ELH-4É","FEL-4T","ELO-5É","HAT-5T","OLD-5É","IST-5T","ELH-5É","FEL-5T","K2","ELO-1T","HAT-1É","OLD-1T","IST-1É","ELH-1T","FEL-1É","ELO-2T","HAT-2É","OLD-2T","IST-2É","ELH-2T","FEL-2É","K3","ELO-3T","HAT-3É","OLD-3T","IST-3É","ELH-3T","FEL-3É","K4","ELO-4T","HAT-4É","OLD-4T","IST-4É","ELH-4T","FEL-4É","ELO-5T","HAT-5É","OLD-5T","IST-5É","ELH-5T","FEL-5É","K5","K6"]},"interview":{"duration":"30–45 perc, párokként kb. 4–5 perc","intro":["Köszönd meg, hogy eljött, és mondd el, hogy a beszélgetés célja az önismeret és a növekedés, nem minősítés.","Tisztázd a titoktartást: a jegyzeteket és a pontokat csak ő és az általa kijelölt személy látja.","Mondd el, hogy konkrét helyzetekről fogsz kérdezni, és nincs jó vagy rossz válasz. Ha valamiről nem szeretne beszélni, kihagyhatja.","Ha a közösségben szokás, kezdjétek rövid imádsággal."],"probes":["Pontosan mit csináltál te?","Mi volt benned közben? Mit éreztél, mit gondoltál?","Mi lett az eredménye, rád és másokra nézve?","Ma mit csinálnál másként?","Milyen gyakran fordul elő veled ilyen?"],"closing":["Kérdezd meg, mi volt a legmeglepőbb számára a beszélgetésben.","Foglald össze röviden az erősségeket, és egy-két irányt, amerre növekedhet. A torzult mintákat fejlődési lehetőségként fogalmazd meg.","Beszéljétek meg, hogyan kapja meg az eredményt, és ki láthatja.","Ha a közösségben szokás, zárjátok imádsággal."],"anchorsE":{"1":"Nincs konkrét példa, csak általánosságok.","2":"Egy halvány vagy bizonytalan példa.","3":"Van konkrét példa, de csak kedvező körülmények között, nem következetesen.","4":"Több konkrét példa, nehéz helyzetben is.","5":"Következetes minta nehézségek között is, és a „mások szemével” kérdés is visszaigazolja."},"anchorsT":{"1":"Nincs jele; stresszhelyzetben is érett reakció.","2":"Ritkán fordul elő, felismeri és korrigálja.","3":"Időnként előfordul, részben felismeri.","4":"Ismétlődő minta, nyomás alatt jellemző.","5":"Uralkodó minta, nem ismeri fel, vagy igazolja."},"rules":["A pontozás közvetlenül a beszélgetés után történjen, a jegyzetek és a jelek alapján, ne a kitöltő önminősítése alapján.","Az elmondott konkrét viselkedés számít, nem a szándék vagy az általános önkép.","A „mások szemével” kérdésre adott válasz és a stresszhelyzetes történet nagyobb súlyú a torzult pontszámnál, mint a nyitó történet.","Ha az 1. kör túl kedvező önképet jelzett, használj több rákérdezést és stresszhelyzetes kérdést."],"safety":"Ha a beszélgetés során komoly krízis jelei merülnek fel (bántalmazás, tartós reménytelenség, önsértés vagy öngyilkosság gondolata), a pontozást hagyd abba, és segíts a kitöltőnek szakemberhez fordulni. Magyarországon a Lelki Elsősegély Telefonszolgálat ingyenesen hívható a 116-123-as számon."},"sjt":{"instructions":"Minden helyzethez három lehetséges reakció tartozik. Válaszd ki, melyiket tennéd a legvalószínűbben, és melyiket a legkevésbé valószínűen. Nem az a kérdés, mit kellene tenni, hanem hogy te mit tennél valójában."}}</script>
<script>
'use strict';

const BANK = JSON.parse(document.getElementById('kerdesbank').textContent);
const STORAGE_KEY = 'jellemprofil:kitoltes:v1';
const STATE_SCHEMA = 'jellemprofil-kitoltes/1';
const MAX_SELECTED = 8;
const PAGE_SIZE = 11;
const HIGH = 75;
const LOW = 25;
const SCALE_SHORT = { 1: 'egyáltalán nem', 2: 'kevéssé', 3: 'részben', 4: 'nagyrészt', 5: 'teljesen' };
const LETTER = { E: 'É', T: 'T', H: 'H' };
const ORDER = BANK.round1.order;
const PAGES = Math.ceil(ORDER.length / PAGE_SIZE);
const pairById = Object.fromEntries(BANK.pairs.map((p) => [p.id, p]));
const axisById = Object.fromEntries(BANK.axes.map((a) => [a.id, a]));
const controlById = Object.fromEntries(BANK.round1.controls.map((c) => [c.id, c]));
const COMPACT = window.matchMedia('(max-width: 560px)');
const VIEWS = ['start', 'resume', 'r1', 'result', 'sjt', 'interview'];

const app = document.getElementById('app');
let state;
let ui;
let savedUi = null;

// ---------- állapot ----------

function nowIso() { return new Date().toISOString(); }

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64;
  b[8] = (b[8] & 63) | 128;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

function newState() {
  return {
    schema: STATE_SCHEMA,
    bankVersion: BANK.version,
    id: uuid(),
    respondent: { name: '', consentAt: null },
    startedAt: nowIso(),
    updatedAt: nowIso(),
    round1: { answers: {} },
    round2: { manual: false, selected: [], sjt: {}, interview: {}, interviewer: '' },
  };
}

function save() {
  state.updatedAt = nowIso();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ state, ui })); } catch { /* tárolás nem elérhető */ }
}

function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    return d && d.state && d.state.schema === STATE_SCHEMA ? d : null;
  } catch { return null; }
}

function clearDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch { /* tárolás nem elérhető */ }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function itemText(code) {
  if (controlById[code]) return controlById[code].text;
  return pairById[code.slice(0, -1)].r1[code.endsWith('É') ? 'E' : 'T'];
}

// ---------- számítás ----------

const to100 = (v) => Math.round(((v - 1) / 4) * 100);
const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;
const answered = () => ORDER.filter((c) => state.round1.answers[c] != null).length;
const r1Complete = () => answered() === ORDER.length;

function sjtScores(pid) {
  const arr = state.round2.sjt[pid];
  if (!arr || arr.length !== 3 || !arr.every((s) => s && s.most && s.least)) return null;
  const pts = { E: 0, T: 0, H: 0 };
  for (const s of arr) {
    pts[s.most] += 2;
    const middle = ['E', 'T', 'H'].find((k) => k !== s.most && k !== s.least);
    pts[middle] += 1;
  }
  return { E: Math.round((pts.E / 6) * 100), T: Math.round((pts.T / 6) * 100), H: Math.round((pts.H / 6) * 100) };
}

function ivScores(pid) {
  const o = state.round2.interview[pid];
  if (!o || (o.E == null && o.T == null)) return null;
  return { E: o.E != null ? to100(o.E) : null, T: o.T != null ? to100(o.T) : null };
}

function pattern(E, T) {
  if (E >= HIGH && T <= LOW) return 'Érett erősség';
  if (E >= HIGH && T >= HIGH) return 'Túlhajtott erősség';
  if (E <= LOW && T >= HIGH) return 'Torzulás dominál';
  if (E <= LOW && T <= LOW) return 'Fejletlen terület';
  return '';
}

function pairResult(pid) {
  const a = state.round1.answers;
  const r1 = { E: to100(a[`${pid}É`]), T: to100(a[`${pid}T`]) };
  const sjt = sjtScores(pid);
  const iv = ivScores(pid);
  const final = {};
  for (const L of ['E', 'T']) {
    const r2 = [sjt?.[L], iv?.[L]].filter((v) => v != null);
    final[L] = r2.length ? Math.round((r1[L] + 2 * mean(r2)) / 3) : r1[L];
  }
  const sources = ['1. kör'];
  if (sjt) sources.push('szituációk');
  if (iv) sources.push('interjú');
  const tags = [];
  if (sjt && sjt.H > sjt.E && sjt.H > sjt.T) tags.push('a szituációkban fejletlen');
  return { id: pid, r1, sjt, iv, E: final.E, T: final.T, pattern: pattern(final.E, final.T), sources, tags };
}

function computeResults() {
  const pairs = Object.fromEntries(BANK.pairs.map((p) => [p.id, pairResult(p.id)]));
  const axes = {};
  for (const ax of BANK.axes) {
    const ps = BANK.pairs.filter((p) => p.axis === ax.id).map((p) => pairs[p.id]);
    axes[ax.id] = {
      E: Math.round(mean(ps.map((p) => p.E))),
      T: Math.round(mean(ps.map((p) => p.T))),
      flag: ps.some((p) => p.T >= HIGH),
    };
  }
  const a = state.round1.answers;
  const lieIds = BANK.round1.controls.filter((c) => c.type === 'lie').map((c) => c.id);
  const lieMean = mean(lieIds.map((id) => a[id]));
  const inconsistent = BANK.round1.controls
    .filter((c) => c.type === 'consistency')
    .filter((c) => Math.abs(a[c.reverseOf] - (6 - a[c.id])) >= 3)
    .map((c) => c.id);
  const forwardBack = axes.ELO.E - axes.HAT.E;
  return {
    pairs,
    axes,
    flags: {
      favorableSelfImage: lieMean >= 4,
      lieMean: Math.round(lieMean * 100) / 100,
      inconsistent,
      lowReliability: inconsistent.length >= 2,
      forwardBack,
      imbalance: Math.abs(forwardBack) >= 30,
    },
    round2Pairs: Object.values(pairs).filter((p) => p.sjt || p.iv).length,
  };
}

const REASONS = {
  1: 'túlhajtott erősség',
  2: 'kiugró torzult vonás',
  3: 'erősség megerősítése',
  4: 'fejletlen terület',
  manual: 'kézzel kiválasztva',
};

function autoSelect() {
  const a = state.round1.answers;
  const info = BANK.pairs.map((p, idx) => ({ id: p.id, axis: p.axis, idx, E: a[`${p.id}É`], T: a[`${p.id}T`] }));
  const picked = [];
  const axisCount = {};
  const has = (id) => picked.some((x) => x.id === id);
  function tier(reason, filter, cmp, limit = Infinity) {
    const cands = info.filter((c) => !has(c.id) && filter(c)).sort((x, y) => cmp(x, y) || x.idx - y.idx);
    let taken = 0;
    while (cands.length && picked.length < MAX_SELECTED && taken < limit) {
      const ties = cands.filter((c) => cmp(c, cands[0]) === 0);
      const pick = ties.reduce((best, c) => ((axisCount[c.axis] || 0) < (axisCount[best.axis] || 0) ? c : best));
      cands.splice(cands.indexOf(pick), 1);
      picked.push({ id: pick.id, reason });
      axisCount[pick.axis] = (axisCount[pick.axis] || 0) + 1;
      taken++;
    }
  }
  tier(1, (c) => c.E >= 4 && c.T >= 4, (x, y) => y.T - x.T || y.E - x.E);
  tier(2, (c) => c.T >= 4, (x, y) => y.T - x.T);
  tier(3, (c) => c.E === 5 && c.T <= 2, (x, y) => x.T - y.T, 2);
  tier(4, (c) => c.E <= 2, (x, y) => x.E - y.E);
  return picked;
}

function selection() {
  if (state.round2.manual) return state.round2.selected.map((id) => ({ id, reason: 'manual' }));
  return autoSelect();
}

const selectedIds = () => selection().map((s) => s.id);

// ---------- radar ----------

function polar(i, n, r) {
  const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
  return [r * Math.cos(a), r * Math.sin(a)];
}

const pt = (xy) => xy.map((v) => v.toFixed(1)).join(',');

function wrap(text, max) {
  const lines = [];
  let cur = '';
  for (const w of text.split(' ')) {
    if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else cur = cur ? `${cur} ${w}` : w;
  }
  if (cur) lines.push(cur);
  return lines;
}

function radarSvg({ labels, E, T, clickable, selected, ariaLabel }) {
  const n = labels.length;
  const R = 118;
  const f = (v) => (v / 100) * R;
  const compact = COMPACT.matches;
  const fs = compact ? { t: 19, s: 16, tick: 13, lh: 21, wt: 11, ws: 13 } : { t: 13, s: 11.5, tick: 10, lh: 14, wt: 22, ws: 24 };
  const vb = compact
    ? (n === 6 ? '-285 -215 570 430' : '-290 -240 580 490')
    : (n === 6 ? '-270 -190 540 380' : '-285 -195 570 395');
  let g = '';
  for (const lv of [25, 50, 75, 100]) {
    g += `<polygon class="grid" points="${labels.map((_, i) => pt(polar(i, n, (lv / 100) * R))).join(' ')}"/>`;
  }
  labels.forEach((_, i) => { g += `<line class="grid" x1="0" y1="0" x2="${polar(i, n, R)[0].toFixed(1)}" y2="${polar(i, n, R)[1].toFixed(1)}"/>`; });
  for (const lv of [50, 100]) g += `<text class="tick" x="7" y="${(-(lv / 100) * R + 11).toFixed(1)}" font-size="${fs.tick}">${lv}</text>`;
  g += `<polygon class="area-e" points="${E.map((v, i) => pt(polar(i, n, f(v)))).join(' ')}"/>`;
  g += `<polygon class="area-t" points="${T.map((v, i) => pt(polar(i, n, f(v)))).join(' ')}"/>`;
  labels.forEach((_, i) => {
    const [tx, ty] = polar(i, n, f(T[i]));
    g += `<rect class="mk-t" x="${(tx - 4.5).toFixed(1)}" y="${(ty - 4.5).toFixed(1)}" width="9" height="9"/>`;
  });
  labels.forEach((_, i) => {
    const [ex, ey] = polar(i, n, f(E[i]));
    g += `<circle class="mk-e" cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4"/>`;
  });
  labels.forEach((l, i) => {
    const [hx, hy] = polar(i, n, R + 8);
    const tip = `${l.tipTitle}: érett ${E[i]} · torzult ${T[i]}${l.flag ? ' · kiugró torzult vonás' : ''}`;
    g += `<line class="hit" x1="0" y1="0" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" data-tip="${esc(tip)}"/>`;
    const [lx, ly] = polar(i, n, R + 16);
    const anchor = Math.abs(lx) < 8 ? 'middle' : lx > 0 ? 'start' : 'end';
    const lines = [
      ...wrap(l.title, fs.wt).map((t) => ({ t, c: 'lt', size: fs.t })),
      ...(l.sub ? wrap(l.sub, fs.ws) : []).map((t) => ({ t, c: 'ls', size: fs.s })),
    ];
    const lh = fs.lh;
    let y0;
    if (ly < -R * 0.9) y0 = ly - (lines.length - 1) * lh;
    else if (ly > R * 0.9) y0 = ly + 10;
    else y0 = ly - ((lines.length - 1) * lh) / 2 + 4;
    const tspans = lines.map((ln, j) => {
      const flag = j === 0 && l.flag ? '<tspan class="flag">⚠ </tspan>' : '';
      return `<tspan x="${lx.toFixed(1)}" y="${(y0 + j * lh).toFixed(1)}" class="${ln.c}" font-size="${ln.size}">${flag}${esc(ln.t)}</tspan>`;
    }).join('');
    const attrs = clickable
      ? ` class="lbl click${l.key === selected ? ' sel' : ''}" role="button" tabindex="0" data-action="axis" data-axis="${l.key}" aria-label="${esc(l.tipTitle)} részletei"`
      : ' class="lbl"';
    g += `<text text-anchor="${anchor}"${attrs}>${tspans}</text>`;
  });
  return `<div class="radar-wrap"><svg viewBox="${vb}" role="img" aria-label="${esc(ariaLabel)}">${g}</svg><div class="tip" hidden></div></div>`;
}

function legendHtml() {
