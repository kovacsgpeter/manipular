  }
  if (R.flags.lowReliability) {
    out.push(`<div class="notice"><span class="icon-warn" aria-hidden="true">⚠</span> <strong>Alacsony megbízhatóság.</strong> ${R.flags.inconsistent.length} ellenőrző állításpár ellentmond egymásnak. Az eredményt érdemes személyes beszélgetésben átnézni, vagy a kérdőívet újra kitölteni.</div>`);
  }
  if (R.flags.imbalance) {
    const fwd = R.flags.forwardBack > 0;
    out.push(`<div class="notice"><strong>Egyensúly:</strong> az Előre (${R.axes.ELO.E}) és a Hátra (${R.axes.HAT.E}) érett rétege között legalább 30 pont a különbség – ${fwd ? 'erős az áttörés, de kevés, ami megtartsa' : 'erős a megtartás, de kevés az áttörés'}.</div>`);
  }
  return out.join('');
}

function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function optionOrder(pid, s) {
  let x = hashSeed(`${state.id}|${pid}|${s}`) || 1;
  const rand = () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967296; };
  const arr = ['E', 'T', 'H'];
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

function sjtEntry(pid, s) {
  const arr = state.round2.sjt[pid] || (state.round2.sjt[pid] = [{}, {}, {}]);
  return arr[s] || (arr[s] = {});

const sjtPairDone = (pid) => [0, 1, 2].every((s) => { const e = state.round2.sjt[pid]?.[s]; return e && e.most && e.least; });

function viewSjt() {
  const ids = selectedIds();
  if (!ids.length) { ui.view = 'result'; return viewResult(); }
  const i = Math.min(ui.pairIdx || 0, ids.length - 1);
  const pid = ids[i];
  const p = pairById[pid];
  const scen = p.sjt.map((sc, s) => {
    const e = state.round2.sjt[pid]?.[s] || {};
    const opts = optionOrder(pid, s).map((k, j) => `<div class="option"><p>${esc(sc[k])}</p>
      <div class="choices" role="group" aria-label="${j + 1}. reakció">
        <label class="choice"><input type="radio" name="m-${pid}-${s}" data-sjt="most" data-pid="${pid}" data-s="${s}" value="${k}" ${e.most === k ? 'checked' : ''}><span>Legvalószínűbb</span></label>
        <label class="choice"><input type="radio" name="l-${pid}-${s}" data-sjt="least" data-pid="${pid}" data-s="${s}" value="${k}" ${e.least === k ? 'checked' : ''}><span>Legkevésbé valószínű</span></label>
      </div></div>`).join('');
    return `<div class="scenario"><p class="stem">${i * 3 + s + 1}. ${esc(sc.stem)}</p>${opts}</div>`;
  }).join('');
  const done = sjtPairDone(pid);
  const last = i === ids.length - 1;
  const total = ids.filter(sjtPairDone).length;
  return `${topbar()}
  <h1 tabindex="-1">2. kör – helyzetek</h1>
  <p class="small">${i + 1}. csoport / ${ids.length} · ${total} csoport kész</p>
  <div class="progress" aria-hidden="true"><div style="width:${(total / ids.length) * 100}%"></div></div>
  ${i === 0 ? `<div class="card"><p>${esc(BANK.sjt.instructions)}</p></div>` : ''}
  ${scen}
  <p class="hint" ${done ? 'hidden' : ''}>A továbblépéshez minden helyzetnél jelöld meg a legvalószínűbb és a legkevésbé valószínű reakciót.</p>
  <div class="nav">
    <button class="secondary" data-action="sjtPrev">Vissza</button>
    <button data-action="sjtNext" ${done ? '' : 'disabled'}>${last ? 'Kész – eredmény' : 'Tovább'}</button>
  </div>`;
}

function viewInterview() {
  const ids = selectedIds();
  if (!ids.length) { ui.view = 'result'; return viewResult(); }
  const i = Math.min(ui.pairIdx || 0, ids.length - 1);
  const pid = ids[i];
  const p = pairById[pid];
  const q = p.interview;
  const iv = BANK.interview;
  const o = state.round2.interview[pid] || {};
  const a = state.round1.answers;
  const R = computeResults();
  const last = i === ids.length - 1;
  const intro = i === 0 ? `<div class="card">
      <label class="field" for="interviewer" style="margin-top:0">Kérdező neve</label>
      <input type="text" id="interviewer" data-interviewer value="${esc(state.round2.interviewer)}" autocomplete="off">
      <h3>Nyitás</h3><ul>${iv.intro.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
      <p class="small">Időigény: ${esc(iv.duration)}.</p>
    </div>
    ${R.flags.favorableSelfImage ? '<div class="notice"><span class="icon-warn" aria-hidden="true">⚠</span> Az 1. kör túl kedvező önképet jelzett: használj több rákérdezést és stresszhelyzetes kérdést.</div>' : ''}
    <div class="notice"><strong>Biztonság:</strong> ${esc(iv.safety)}</div>` : '';
  const anchors = `<details><summary>Pontozási útmutató</summary><div class="table-scroll"><table>
      <thead><tr><th class="num">Pont</th><th>Érett vonás</th><th>Torzult vonás</th></tr></thead>
      <tbody>${[1, 2, 3, 4, 5].map((k) => `<tr><td class="num">${k}</td><td>${esc(iv.anchorsE[k])}</td><td>${esc(iv.anchorsT[k])}</td></tr>`).join('')}</tbody></table></div>
      <ul>${iv.rules.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></details>`;
  return `${topbar()}
  <h1 tabindex="-1">2. kör – élő interjú</h1>
  <p class="small">Kérdező nézet · ${i + 1}. pár / ${ids.length} · ${ids.filter((id) => ivScores(id)).length} pár pontozva</p>
  ${intro}
  <h2>${esc(p.mature)} / ${esc(p.distorted)}</h2>
  <p class="small">${esc(axisById[p.axis].name)} (${esc(axisById[p.axis].direction)}) · 1. kör: érett ${a[`${pid}É`]}, torzult ${a[`${pid}T`]} (1–5)</p>
  <ol class="qlist">
    <li><span class="qlabel">Nyitó történet</span>${esc(q.main)}</li>
    <li><span class="qlabel">Stresszhelyzet</span>${esc(q.stress)}</li>
    <li><span class="qlabel">Mások szemével</span>${esc(q.others)}</li>
  </ol>
  <details><summary>Általános rákérdezések</summary><ul>${iv.probes.map((s) => `<li>„${esc(s)}”</li>`).join('')}</ul></details>
  <div class="card">
    <p><strong>Érett jelek:</strong></p><ul>${q.signsE.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
    <p><strong>Torzult jelek:</strong></p><ul>${q.signsT.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
  </div>
  <fieldset class="score-row"><legend><strong>Érett vonás: ${esc(p.mature)}</strong></legend>${likertHtml(`ivE-${pid}`, o.E, `data-iv="E" data-pid="${pid}"`)}</fieldset>
  <fieldset class="score-row"><legend><strong>Torzult vonás: ${esc(p.distorted)}</strong></legend>${likertHtml(`ivT-${pid}`, o.T, `data-iv="T" data-pid="${pid}"`)}</fieldset>
  ${anchors}
  <label class="field" for="note-${pid}">Jegyzet</label>
  <textarea id="note-${pid}" data-ivnote="${pid}">${esc(o.notes || '')}</textarea>
  ${last ? `<div class="card"><h3 style="margin-top:0">Zárás</h3><ul>${iv.closing.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
  <div class="nav">
    <button class="secondary" data-action="ivPrev">Vissza</button>
    <button data-action="ivNext">${last ? 'Kész – eredmény' : 'Következő pár'}</button>
  </div>`;
}

// ---------- export ----------

function slug(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'kitoltes';
}

function download(filename, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const fileBase = () => `jellemprofil_${slug(state.respondent.name)}_${new Date().toISOString().slice(0, 10)}`;

function csvCell(v) {
  if (v == null) return '';
  let s = String(v);
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = `'${s}`;
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

const toCsv = (rows) => '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
const yesNo = (b) => (b ? 'igen' : 'nem');
const layerName = (L) => (L === 'E' ? 'érett' : 'torzult');

function exportJson() {
  const data = { ...state, exportedAt: nowIso(), results: computeResults() };
  download(`${fileBase()}.json`, JSON.stringify(data, null, 2), 'application/json');
}

function exportCsvLong() {
  const R = computeResults();
  const base = [state.id, state.respondent.name, state.updatedAt.slice(0, 10)];
  const rows = [['kitolto_id', 'kitolto', 'datum', 'kor', 'forras', 'kod', 'terulet', 'par', 'reteg', 'ertek', 'szoveg']];
  const a = state.round1.answers;
  for (const code of ORDER) {
    if (controlById[code]) rows.push([...base, '1', 'kontroll', code, '', '', controlById[code].type === 'lie' ? 'kedvező önkép' : `fordított: ${controlById[code].reverseOf}`, a[code], controlById[code].text]);
    else {
      const pid = code.slice(0, -1);
      rows.push([...base, '1', 'kerdoiv', code, pairById[pid].axis, pid, code.endsWith('É') ? 'érett' : 'torzult', a[code], itemText(code)]);
    }
  }
  for (const p of BANK.pairs) {
    const arr = state.round2.sjt[p.id];
    if (arr) arr.forEach((e, s) => {
      if (!e) return;
      if (e.most) rows.push([...base, '2', 'szituacio', `${p.id}/${s + 1}`, p.axis, p.id, 'legvalószínűbb', LETTER[e.most], p.sjt[s][e.most]]);
      if (e.least) rows.push([...base, '2', 'szituacio', `${p.id}/${s + 1}`, p.axis, p.id, 'legkevésbé', LETTER[e.least], p.sjt[s][e.least]]);
    });
    const o = state.round2.interview[p.id];
    if (o) {
      if (o.E != null) rows.push([...base, '2', 'interju', `${p.id}É`, p.axis, p.id, 'érett', o.E, '']);
      if (o.T != null) rows.push([...base, '2', 'interju', `${p.id}T`, p.axis, p.id, 'torzult', o.T, '']);
      if (o.notes) rows.push([...base, '2', 'interju', `${p.id}`, p.axis, p.id, 'jegyzet', '', o.notes]);
    }
  }
  if (state.round2.interviewer) rows.push([...base, '2', 'interju', 'kerdezo', '', '', '', '', state.round2.interviewer]);
  for (const ax of BANK.axes) {
    rows.push([...base, 'eredmeny', 'terulet', ax.id, ax.id, '', 'érett', R.axes[ax.id].E, ax.name]);
    rows.push([...base, 'eredmeny', 'terulet', ax.id, ax.id, '', 'torzult', R.axes[ax.id].T, ax.name]);
    rows.push([...base, 'eredmeny', 'terulet', ax.id, ax.id, '', 'jelzés', yesNo(R.axes[ax.id].flag), '']);
  }
  for (const p of BANK.pairs) {
    const r = R.pairs[p.id];
    rows.push([...base, 'eredmeny', 'par', p.id, p.axis, p.id, 'érett', r.E, p.mature]);
    rows.push([...base, 'eredmeny', 'par', p.id, p.axis, p.id, 'torzult', r.T, p.distorted]);
    rows.push([...base, 'eredmeny', 'par', p.id, p.axis, p.id, 'minta', '', [r.pattern, ...r.tags].filter(Boolean).join('; ')]);
  }
  rows.push([...base, 'eredmeny', 'ellenorzes', 'kedvezo_onkep', '', '', '', yesNo(R.flags.favorableSelfImage), `átlag: ${R.flags.lieMean}`]);
  rows.push([...base, 'eredmeny', 'ellenorzes', 'konzisztencia_elteres', '', '', '', R.flags.inconsistent.length, R.flags.inconsistent.join(' ')]);
  rows.push([...base, 'eredmeny', 'ellenorzes', 'elore_hatra_kulonbseg', '', '', '', R.flags.forwardBack, '']);
  rows.push([...base, 'eredmeny', 'ellenorzes', 'masodik_kor_parok', '', '', '', selectedIds().length, selectedIds().join(' ')]);
  download(`${fileBase()}_reszletes.csv`, toCsv(rows), 'text/csv;charset=utf-8');
}

function exportCsvWide() {
  const R = computeResults();
  const head = ['kitolto_id', 'kitolto', 'datum'];
  const row = [state.id, state.respondent.name, state.updatedAt.slice(0, 10)];
  for (const ax of BANK.axes) {
    head.push(`${ax.id}_erett`, `${ax.id}_torzult`, `${ax.id}_jelzes`);
    row.push(R.axes[ax.id].E, R.axes[ax.id].T, yesNo(R.axes[ax.id].flag));
  }
  head.push('kedvezo_onkep', 'konzisztencia_elteresek', 'elore_hatra_kulonbseg', 'masodik_kor_parok');
  row.push(yesNo(R.flags.favorableSelfImage), R.flags.inconsistent.length, R.flags.forwardBack, selectedIds().join(' '));
  for (const p of BANK.pairs) {
    const r = R.pairs[p.id];
    head.push(`${p.id}_erett`, `${p.id}_torzult`, `${p.id}_minta`);
    row.push(r.E, r.T, [r.pattern, ...r.tags].filter(Boolean).join('; '));
  }
  for (const p of BANK.pairs) {
    const r = R.pairs[p.id];
    head.push(`${p.id}_szituacio_erett`, `${p.id}_szituacio_torzult`, `${p.id}_interju_erett`, `${p.id}_interju_torzult`);
    row.push(r.sjt?.E, r.sjt?.T, r.iv?.E, r.iv?.T);
  }
  for (const code of ORDER) {
    head.push(`k1_${code.replace('É', 'E')}`);
    row.push(state.round1.answers[code]);
  }
  download(`${fileBase()}_egysor.csv`, toCsv([head, row]), 'text/csv;charset=utf-8');
}

function importJson(text) {
  let d;
  try { d = JSON.parse(text); } catch { throw new Error('A fájl nem érvényes JSON.'); }
  if (!d || d.schema !== STATE_SCHEMA) throw new Error('Ez a fájl nem jellemprofil-kitöltés.');
  const s = newState();
  s.id = typeof d.id === 'string' ? d.id : s.id;
  s.bankVersion = d.bankVersion;
  s.startedAt = d.startedAt || s.startedAt;
  s.respondent = { name: String(d.respondent?.name || ''), consentAt: d.respondent?.consentAt || null };
  for (const code of ORDER) {
    const v = Number(d.round1?.answers?.[code]);
    if (v >= 1 && v <= 5) s.round1.answers[code] = Math.round(v);
  }
  const r2 = d.round2 || {};
  s.round2.manual = !!r2.manual;
  s.round2.selected = Array.isArray(r2.selected) ? r2.selected.filter((id) => pairById[id]).slice(0, MAX_SELECTED) : [];
  s.round2.interviewer = String(r2.interviewer || '');
  for (const p of BANK.pairs) {
    const arr = r2.sjt?.[p.id];
    if (Array.isArray(arr)) {
      s.round2.sjt[p.id] = [0, 1, 2].map((i) => {
        const e = arr[i] || {};
        const ok = (k) => (['E', 'T', 'H'].includes(k) ? k : undefined);
        return { most: ok(e.most), least: ok(e.least) };
      });
    }
    const o = r2.interview?.[p.id];
    if (o) {
      const sc = (v) => (Number(v) >= 1 && Number(v) <= 5 ? Math.round(Number(v)) : undefined);
      s.round2.interview[p.id] = { E: sc(o.E), T: sc(o.T), notes: String(o.notes || '') };
    }
  }
  state = s;
  ui = { view: r1Complete() ? 'result' : 'r1', page: 0 };
  if (!state.respondent.consentAt) ui = { view: 'start' };
  if (d.bankVersion !== BANK.version) ui.info = `A fájl a kérdésbank ${d.bankVersion} változatával készült, ez a kitöltő a ${BANK.version} változatot használja.`;
}

// ---------- vezérlés ----------

function render({ keepScroll = false } = {}) {
  const y = window.scrollY;
  const view = { start: viewStart, resume: viewResume, r1: viewR1, result: viewResult, sjt: viewSjt, interview: viewInterview }[ui.view] || viewStart;
  app.innerHTML = (ui.info ? `<div class="notice">${esc(ui.info)}</div>` : '') + view();
  if (keepScroll) window.scrollTo(0, y);
  else {
    window.scrollTo(0, 0);
    app.querySelector('h1')?.focus({ preventScroll: true });
  }
}

function go(view, extra = {}) {
  ui = { view, ...extra };
  save();
  render();
}

const actions = {
  start() {
    if (!state.respondent.consentAt) return;
    go(r1Complete() ? 'result' : 'r1', { page: 0 });
  },
  resume() {
    const v = savedUi && VIEWS.includes(savedUi.view) && savedUi.view !== 'resume' ? savedUi : { view: 'r1', page: 0 };
    if (!state.respondent.consentAt) v.view = 'start';
    go(v.view, { page: v.page || 0, pairIdx: v.pairIdx || 0, detailAxis: v.detailAxis });
  },
  discard() {
    if (!confirm('Biztosan törlöd a korábbi kitöltést? Ez nem vonható vissza.')) return;
    clearDraft();
    state = newState();
    go('start');
  },
  newFill() {
    if (!confirm('Új kitöltést kezdesz. A mostani válaszok törlődnek ebből a böngészőből. Mentetted őket fájlba?')) return;
    clearDraft();
    state = newState();
    go('start');
  },
  r1prev() { if ((ui.page || 0) === 0) go('start'); else go('r1', { page: ui.page - 1 }); },
  r1next() { if (pageComplete(ui.page || 0)) go('r1', { page: (ui.page || 0) + 1 }); },
  r1finish() { if (r1Complete()) go('result'); },
  editR1() { go('r1', { page: 0 }); },
  axis(el) {
    ui.detailAxis = el.dataset.axis;
    save();
    render({ keepScroll: true });
    const sel = el.tagName === 'BUTTON' ? '.tabs' : '.lbl';
    app.querySelector(`${sel}[data-axis="${ui.detailAxis}"], ${sel} [data-axis="${ui.detailAxis}"]`)?.focus();
  },
  autoSelect() {
    state.round2.manual = false;
    state.round2.selected = [];
    save();
    render({ keepScroll: true });
  },
  toSjt() { if (selectedIds().length) go('sjt', { pairIdx: 0 }); },
  toInterview() { if (selectedIds().length) go('interview', { pairIdx: 0 }); },
  sjtPrev() { if ((ui.pairIdx || 0) === 0) go('result'); else go('sjt', { pairIdx: ui.pairIdx - 1 }); },
  sjtNext() {
    const ids = selectedIds();
    const i = ui.pairIdx || 0;
    if (!sjtPairDone(ids[i])) return;
    if (i >= ids.length - 1) go('result'); else go('sjt', { pairIdx: i + 1 });
  },
  ivPrev() { if ((ui.pairIdx || 0) === 0) go('result'); else go('interview', { pairIdx: ui.pairIdx - 1 }); },
  ivNext() {
    const ids = selectedIds();
    const i = ui.pairIdx || 0;
    if (i >= ids.length - 1) go('result'); else go('interview', { pairIdx: i + 1 });
  },
  exportJson,
  exportCsvLong,
  exportCsvWide,
};

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  if (ui.info) delete ui.info;
  actions[el.dataset.action]?.(el, e);
});

app.addEventListener('keydown', (e) => {
  const el = e.target.closest('[role="button"][data-action]');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); actions[el.dataset.action]?.(el, e); }
});

app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.likert) {
    state.round1.answers[t.dataset.likert] = Number(t.value);
    save();
    const done = answered();
    document.getElementById('done').textContent = done;
    document.getElementById('bar').style.width = `${(done / ORDER.length) * 100}%`;
    const ok = pageComplete(ui.page || 0);
    document.getElementById('nextBtn').disabled = !ok;
    document.getElementById('pageHint').hidden = ok;
  } else if (t.matches('[data-consent]')) {
    state.respondent.consentAt = t.checked ? nowIso() : null;
    save();
    document.getElementById('startBtn').disabled = !t.checked;
  } else if (t.dataset.sjt) {
    const e2 = sjtEntry(t.dataset.pid, Number(t.dataset.s));
    const other = t.dataset.sjt === 'most' ? 'least' : 'most';
    e2[t.dataset.sjt] = t.value;
    if (e2[other] === t.value) delete e2[other];
    save();
    render({ keepScroll: true });
  } else if (t.dataset.iv) {
    const pid = t.dataset.pid;
    state.round2.interview[pid] = { ...(state.round2.interview[pid] || {}), [t.dataset.iv]: Number(t.value) };
    save();
  } else if (t.dataset.select) {
    const ids = selectedIds();
    const id = t.dataset.select;
    const next = t.checked ? [...ids, id].slice(0, MAX_SELECTED) : ids.filter((x) => x !== id);
    state.round2.manual = true;
    state.round2.selected = next;
    save();
    ui.selOpen = true;
    render({ keepScroll: true });
    app.querySelector(`[data-select="${id}"]`)?.focus();
  } else if (t.matches('[data-import]') && t.files?.[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try { importJson(String(reader.result)); save(); render(); } catch (err) { ui.error = err.message; render(); delete ui.error; }
    };
    reader.readAsText(t.files[0]);
  }
});

app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-name]')) { state.respondent.name = t.value; save(); }
  else if (t.matches('[data-interviewer]')) { state.round2.interviewer = t.value; save(); }
  else if (t.dataset.ivnote) {
    const pid = t.dataset.ivnote;
    state.round2.interview[pid] = { ...(state.round2.interview[pid] || {}), notes: t.value };
    save();
  }
});

function showTip(target, clientX, clientY) {
  const wrapEl = target.closest('.radar-wrap');
  const tip = wrapEl?.querySelector('.tip');
  if (!tip) return;
  const box = wrapEl.getBoundingClientRect();
  tip.textContent = target.dataset.tip;
  tip.hidden = false;
  const x = Math.min(Math.max(clientX - box.left, 80), box.width - 80);
  tip.style.left = `${x}px`;
  tip.style.top = `${clientY - box.top}px`;
}

app.addEventListener('pointermove', (e) => {
  const hit = e.target.closest?.('[data-tip]');
  app.querySelectorAll('.tip').forEach((t) => { if (!hit || !t.parentElement.contains(hit)) t.hidden = true; });
  if (hit) showTip(hit, e.clientX, e.clientY);
});
app.addEventListener('pointerleave', () => app.querySelectorAll('.tip').forEach((t) => { t.hidden = true; }));

// ---------- indulás ----------

COMPACT.addEventListener('change', () => { if (ui.view === 'result') render({ keepScroll: true }); });

const draft = loadDraft();
if (draft) {
  state = draft.state;
  savedUi = draft.ui;
  ui = { view: 'resume' };
} else {
  state = newState();
  ui = { view: 'start' };
}
render();
</script>
