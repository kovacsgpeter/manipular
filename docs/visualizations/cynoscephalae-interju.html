  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

        {
          title: &#x27;Milyen URL-t nyithasson meg az openReleasePage?&#x27;,
          hint: &#x27;A kampányfájl tartalma nem adhat tetszőleges protokollt vagy helyi fájlútvonalat a shellnek.&#x27;,
          options: [&#x27;Csak HTTPS GitHub Releases URL a konfigurált repositoryhoz (Ajánlott MVP)&#x27;, &#x27;Bármilyen HTTPS URL&#x27;, &#x27;Bármilyen, az operációs rendszer által ismert URL-séma&#x27;]
        },
        {
          title: &#x27;Hol és hogyan tároljuk az app-beállításokat?&#x27;,
          hint: &#x27;A helyi kampányútvonal nem való a repóba, és az írás megszakadása sem hagyhat félig írt konfigurációt.&#x27;,
          options: [&#x27;Electron userData/settings.json, temporális fájl + atomi csere; titok nélkül (Ajánlott)&#x27;, &#x27;A kampányrepo .env fájljában&#x27;, &#x27;A rendszer keychainjében minden beállítással együtt&#x27;]
        },
        {
          title: &#x27;Mit tároljon az első one_off teljesítési esemény?&#x27;,
          hint: &#x27;A jutalom az immutable curriculum verzióból újraszámítható, ezért nem feltétlenül kell kanonikus eredményként megismételni.&#x27;,
          options: [&#x27;taskId és contentVersion/hash; a jutalmat a motor képezi le (Ajánlott)&#x27;, &#x27;taskId és a teljes kiszámított jutalom-snapshot&#x27;, &#x27;A teljes feladatdefiníció másolata az eseményben&#x27;]
        },
        {
          title: &#x27;Milyen CI-platformmátrix induljon?&#x27;,
          hint: &#x27;A gyors, olcsó ellenőrzések futhatnak minden változásnál, a csomagolt Electron smoke tesztek ritkábban mindkét célplatformon.&#x27;,
          options: [&#x27;Unit + Git integráció minden pushnál; macOS/Windows Electron smoke a main ágon és release előtt (Ajánlott)&#x27;, &#x27;Minden teszt macOS-en és Windowson minden commitnál&#x27;, &#x27;Csak helyi tesztek, CI nélkül az MVP-ig&#x27;]
        },
        {
          title: &#x27;Mi legyen a következő lépés e kör lezárása után?&#x27;,
          hint: &#x27;A döntések után a koncepció már elegendő lehet az első függőleges szelet technikai elindításához.&#x27;,
          options: [&#x27;Készítsük el a workspace-scaffoldot és az első szeletet (Ajánlott)&#x27;, &#x27;Előbb készüljön kattintható játékfelület-wireframe&#x27;, &#x27;Folytassuk csak a specifikáció részletezését&#x27;]
        }
      ];
      const answers = Array(questions.length).fill(null);
      let step = 0;
      let sending = false;

      const escapeHtml = (value) =&gt; String(value)
        .replaceAll(&#x27;&amp;&#x27;, &#x27;&amp;amp;&#x27;)
        .replaceAll(&#x27;&lt;&#x27;, &#x27;&amp;lt;&#x27;)
        .replaceAll(&#x27;&gt;&#x27;, &#x27;&amp;gt;&#x27;)
        .replaceAll(&#x27;&quot;&#x27;, &#x27;&amp;quot;&#x27;)
        .replaceAll(&quot;&#x27;&quot;, &#x27;&amp;#039;&#x27;);

      const answerValue = () =&gt; {
        const pressed = main.querySelector(&#x27;.cyn-option[aria-pressed=&quot;true&quot;]&#x27;);
        if (!pressed) return null;
        if (pressed.dataset.custom === &#x27;true&#x27;) {
          const text = main.querySelector(&#x27;textarea&#x27;).value.trim();
          return text ? `Saját válasz: ${text}` : null;
        }
        return pressed.dataset.value;
      };

      const selectOption = (button) =&gt; {
        main.querySelectorAll(&#x27;.cyn-option&#x27;).forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
        button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
        const custom = main.querySelector(&#x27;.cyn-custom&#x27;);
        const isCustom = button.dataset.custom === &#x27;true&#x27;;
        custom.classList.toggle(&#x27;is-visible&#x27;, isCustom);
        const next = main.querySelector(&#x27;.cyn-next&#x27;);
        if (next) next.disabled = isCustom &amp;&amp; !main.querySelector(&#x27;textarea&#x27;).value.trim();
        main.querySelector(&#x27;.cyn-error&#x27;).textContent = &#x27;&#x27;;
        if (isCustom) main.querySelector(&#x27;textarea&#x27;).focus();
      };

      const renderQuestion = () =&gt; {
        const q = questions[step];
        const prior = answers[step];
        progressLabel.textContent = `${step + 1} / ${questions.length}`;
        progressBar.style.width = `${((step + 1) / questions.length) * 100}%`;
        const optionMarkup = q.options.map((option, index) =&gt; {
          const selected = prior === option;
          return `&lt;button type=&quot;button&quot; class=&quot;cyn-option&quot; aria-pressed=&quot;${selected}&quot; data-value=&quot;${escapeHtml(option)}&quot;&gt;&lt;span class=&quot;cyn-glyph&quot;&gt;${String.fromCharCode(65 + index)}&lt;/span&gt;&lt;span&gt;${escapeHtml(option)}&lt;/span&gt;&lt;/button&gt;`;
        }).join(&#x27;&#x27;);
        const customSelected = prior &amp;&amp; prior.startsWith(&#x27;Saját válasz: &#x27;);
        const customText = customSelected ? prior.slice(&#x27;Saját válasz: &#x27;.length) : &#x27;&#x27;;
        main.innerHTML = `
          &lt;div class=&quot;cyn-stepmark&quot; aria-hidden=&quot;true&quot;&gt;${step + 1}&lt;/div&gt;
          &lt;h2 class=&quot;cyn-question&quot;&gt;${escapeHtml(q.title)}&lt;/h2&gt;
          &lt;div class=&quot;cyn-hint&quot;&gt;${escapeHtml(q.hint)}&lt;/div&gt;
          &lt;div class=&quot;cyn-options&quot; role=&quot;group&quot; aria-label=&quot;Válaszlehetőségek&quot;&gt;
            ${optionMarkup}
            &lt;button type=&quot;button&quot; class=&quot;cyn-option&quot; aria-pressed=&quot;${Boolean(customSelected)}&quot; data-custom=&quot;true&quot; data-value=&quot;custom&quot;&gt;&lt;span class=&quot;cyn-glyph&quot;&gt;✎&lt;/span&gt;&lt;span&gt;Saját válasz&lt;/span&gt;&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cyn-custom ${customSelected ? &#x27;is-visible&#x27; : &#x27;&#x27;}&quot;&gt;
            &lt;textarea maxlength=&quot;600&quot; aria-label=&quot;Saját válasz&quot; placeholder=&quot;Írd le röviden a saját elképzelésedet…&quot;&gt;${escapeHtml(customText)}&lt;/textarea&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cyn-error&quot; role=&quot;alert&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;cyn-actions&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;cyn-action cyn-back&quot; ${step === 0 ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;Vissza&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;cyn-action cyn-next&quot; ${prior ? &#x27;&#x27; : &#x27;disabled&#x27;}&gt;${step === questions.length - 1 ? &#x27;Összegzés&#x27; : &#x27;Tovább&#x27;}&lt;/button&gt;
          &lt;/div&gt;`;
        main.querySelectorAll(&#x27;.cyn-option&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; selectOption(button)));
        const textarea = main.querySelector(&#x27;textarea&#x27;);
        textarea.addEventListener(&#x27;input&#x27;, () =&gt; {
          const next = main.querySelector(&#x27;.cyn-next&#x27;);
          if (main.querySelector(&#x27;.cyn-option[data-custom=&quot;true&quot;]&#x27;).getAttribute(&#x27;aria-pressed&#x27;) === &#x27;true&#x27;) {
            next.disabled = !textarea.value.trim();
          }
        });
        main.querySelector(&#x27;.cyn-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          const current = answerValue();
          if (current) answers[step] = current;
          if (step &gt; 0) { step -= 1; renderQuestion(); }
        });
        main.querySelector(&#x27;.cyn-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          const value = answerValue();
          if (!value) {
            main.querySelector(&#x27;.cyn-error&#x27;).textContent = &#x27;Válassz egy lehetőséget, vagy írd be a saját válaszodat.&#x27;;
            return;
          }
          answers[step] = value;
          if (step &lt; questions.length - 1) { step += 1; renderQuestion(); }
          else renderSummary();
        });
      };

      const renderSummary = () =&gt; {
        progressLabel.textContent = &#x27;Összegzés&#x27;;
        progressBar.style.width = &#x27;100%&#x27;;
        const rows = questions.map((q, index) =&gt; `
          &lt;div class=&quot;cyn-summary-row&quot;&gt;
            &lt;dt&gt;${index + 1}. ${escapeHtml(q.title)}&lt;/dt&gt;
            &lt;dd&gt;${escapeHtml(answers[index])}&lt;/dd&gt;
          &lt;/div&gt;`).join(&#x27;&#x27;);
        main.innerHTML = `
          &lt;div class=&quot;cyn-stepmark&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/div&gt;
          &lt;h2 class=&quot;cyn-question&quot;&gt;Haditanácsi összegzés&lt;/h2&gt;
          &lt;div class=&quot;cyn-hint&quot;&gt;Ellenőrizd a válaszokat, majd készítsd elő a kimásolható összegzést.&lt;/div&gt;
          &lt;dl class=&quot;cyn-summary&quot;&gt;${rows}&lt;/dl&gt;
          &lt;div class=&quot;cyn-sent&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;cyn-actions&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;cyn-action cyn-back&quot;&gt;Válaszok módosítása&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;cyn-action cyn-send&quot;&gt;Válaszok előkészítése&lt;/button&gt;
          &lt;/div&gt;`;
        main.querySelector(&#x27;.cyn-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          step = questions.length - 1;
          renderQuestion();
        });
        main.querySelector(&#x27;.cyn-send&#x27;).addEventListener(&#x27;click&#x27;, sendAnswers);
      };

      const sendAnswers = async () =&gt; {
        if (sending) return;
        sending = true;
        const button = main.querySelector(&#x27;.cyn-send&#x27;);
        const sent = main.querySelector(&#x27;.cyn-sent&#x27;);
        const summary = questions.map((q, index) =&gt; `${index + 1}. ${q.title}\nVálasz: ${answers[index]}`).join(&#x27;\n\n&#x27;);
        const prompt = `A tizenharmadik koncepcióinterjú válaszai:\n\n${summary}\n\nKérlek, építsd be ezeket a repóban lévő koncepció- és tervdokumentumba, jelezd a következtetéseidet, majd a 18. válaszom alapján hajtsd végre vagy készítsd elő a következő lépést.`;
        let exportBox = main.querySelector(&#x27;.cyn-export&#x27;);
        if (!exportBox) {
          exportBox = document.createElement(&#x27;textarea&#x27;);
          exportBox.className = &#x27;cyn-export&#x27;;
          exportBox.setAttribute(&#x27;aria-label&#x27;, &#x27;Kimásolható interjúválaszok&#x27;);
          exportBox.rows = 14;
          main.querySelector(&#x27;.cyn-summary&#x27;).after(exportBox);
        }
        exportBox.value = prompt;
        exportBox.focus();
        exportBox.select();
        try {
          await navigator.clipboard.writeText(prompt);
          sent.textContent = &#x27;A válaszokat a vágólapra másoltuk.&#x27;;
        } catch {
          sent.textContent = &#x27;A válaszok kijelölve; másold ki őket, és illeszd be a beszélgetésbe.&#x27;;
        }
        button.textContent = &#x27;Válaszok kijelölése&#x27;;
        button.disabled = false;
        sending = false;
      };

      renderQuestion();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
