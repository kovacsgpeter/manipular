:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,

  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);

}

  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,
p {

}

h3,

}

b,
strong,

}

}

.table-responsive {

  overflow-x: auto;

}

.table {

  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {

  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

}

}

}

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;

.card {

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

  border-radius: var(--radius-lg);

  background: var(--popover);

  align-items: center;
  gap: 10px;
}

  border: 0;

  border: 0;

}

  color: var(--accent-foreground);

.text-muted {

.sr-only {

  height: 1px;

  clip: rect(0, 0, 0, 0);

}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {

  flex: 1 1 280px;

  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {

}

.btn,
.form-check-input,
.form-control,
.form-range,

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;

a.btn {

  text-decoration: none;

.btn:not(:disabled):hover {

  color: var(--primary-foreground);
  background: var(--foreground);

  opacity: 0.4;

.form-check:not(.form-switch)

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;

.form-switch .form-check-input:disabled,

.form-switch .form-check-input:checked {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;cynos-game-wireframe&#x27;);
      const panels = root.querySelectorAll(&#x27;[data-panel]&#x27;);
      const navButtons = root.querySelectorAll(&#x27;[data-view]&#x27;);
      const drawer = root.querySelector(&#x27;.cg-drawer&#x27;);
      const drawerBackdrop = root.querySelector(&#x27;.cg-drawer-backdrop&#x27;);
      const drawerContent = root.querySelector(&#x27;.cg-drawer-content&#x27;);
      const toast = root.querySelector(&#x27;.cg-toast&#x27;);
      const disciplina = root.querySelector(&#x27;[data-resource=&quot;disciplina&quot;]&#x27;);
      const taskHotspots = root.querySelectorAll(&#x27;[data-action=&quot;task&quot;]&#x27;);
      const localState = root.querySelector(&#x27;.cg-local-state&#x27;);
      let taskCompleted = false;
      let toastTimer;

      const closeDrawer = () =&gt; {
        drawer.hidden = true;
        drawerBackdrop.hidden = true;
        drawerContent.innerHTML = &#x27;&#x27;;
      };

      const showToast = (message) =&gt; {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.hidden = false;
        toastTimer = setTimeout(() =&gt; { toast.hidden = true; }, 3200);
      };

      const drawerShell = (eyebrow, title, body) =&gt; `
        &lt;div class=&quot;cg-drawer-header&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;cg-eyebrow&quot;&gt;${eyebrow}&lt;/div&gt;&lt;h2&gt;${title}&lt;/h2&gt;&lt;/div&gt;
          &lt;button type=&quot;button&quot; class=&quot;cg-button cg-close&quot; aria-label=&quot;Panel bezárása&quot;&gt;×&lt;/button&gt;
        &lt;/div&gt;
        ${body}`;

      const openDrawer = (markup) =&gt; {
        drawerContent.innerHTML = markup;
        drawer.hidden = false;
        drawerBackdrop.hidden = false;
        const close = drawerContent.querySelector(&#x27;.cg-close&#x27;);
        close.addEventListener(&#x27;click&#x27;, closeDrawer);
        close.focus();
      };

      const openTask = () =&gt; {
        const stateText = taskCompleted ? &#x27;A vállalás teljesítve, a jutalom jóváírva.&#x27; : &#x27;Jelöld készre, amikor valóban teljesítetted.&#x27;;
        const action = taskCompleted
          ? &#x27;&lt;button type=&quot;button&quot; class=&quot;cg-button cg-button-primary&quot; disabled&gt;Teljesítve&lt;/button&gt;&#x27;
          : &#x27;&lt;button type=&quot;button&quot; class=&quot;cg-button cg-button-primary cg-complete-task&quot;&gt;Kész, teljesítettem&lt;/button&gt;&#x27;;
        openDrawer(drawerShell(&#x27;Napi vállalás · one_off&#x27;, &#x27;Rendezd a mai haditervet&#x27;, `
          &lt;p class=&quot;cg-copy&quot;&gt;A menetoszlop csak akkor indul, ha a parancsnok kijelölte a nap egyetlen fontos vállalását.&lt;/p&gt;
          &lt;div class=&quot;cg-objective&quot;&gt;&lt;strong&gt;Feladat&lt;/strong&gt;Írd le magadnak a mai legfontosabb vállalást, és készítsd elő az első lépést.&lt;/div&gt;
          &lt;div class=&quot;cg-reward&quot;&gt;&lt;strong&gt;Jutalom&lt;/strong&gt;+1 Disciplina · a hágó útvonala megerősödik&lt;/div&gt;
          &lt;p class=&quot;cg-copy&quot;&gt;${stateText}&lt;/p&gt;
          &lt;div class=&quot;cg-drawer-actions&quot;&gt;${action}&lt;button type=&quot;button&quot; class=&quot;cg-button cg-go-camp&quot;&gt;Irány a tábor&lt;/button&gt;&lt;/div&gt;`));
        const completeButton = drawerContent.querySelector(&#x27;.cg-complete-task&#x27;);
        if (completeButton) {
          completeButton.addEventListener(&#x27;click&#x27;, () =&gt; {
            taskCompleted = true;
            disciplina.textContent = &#x27;6&#x27;;
            taskHotspots.forEach((hotspot) =&gt; hotspot.classList.add(&#x27;cg-complete&#x27;));
            localState.textContent = &#x27;Helyi állapot: task_completed esemény mentve&#x27;;
            closeDrawer();
            showToast(&#x27;+1 Disciplina · A vállalás rögzítve&#x27;);
          });
        }
        drawerContent.querySelector(&#x27;.cg-go-camp&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          closeDrawer();
          setView(&#x27;camp&#x27;);
        });
      };

      const openSync = () =&gt; {
        const changed = taskCompleted ? &#x27;data/events/marcus/week-01.jsonl&#x27; : &#x27;Nincs engedélyezett helyi változás&#x27;;
        openDrawer(drawerShell(&#x27;Szinkronizálás · dry-run&#x27;, &#x27;Git-műveleti előnézet&#x27;, `
          &lt;p class=&quot;cg-copy&quot;&gt;Ez az előnézet nem módosítja a Git állapotát.&lt;/p&gt;
          &lt;ul class=&quot;cg-sync-list&quot;&gt;
            &lt;li class=&quot;cg-sync-row&quot;&gt;&lt;span&gt;Engedélyezett fájl&lt;/span&gt;&lt;strong&gt;${changed}&lt;/strong&gt;&lt;/li&gt;
            &lt;li class=&quot;cg-sync-row&quot;&gt;&lt;span&gt;Validáció&lt;/span&gt;&lt;strong&gt;${taskCompleted ? &#x27;Rendben&#x27; : &#x27;Nincs teendő&#x27;}&lt;/strong&gt;&lt;/li&gt;
            &lt;li class=&quot;cg-sync-row&quot;&gt;&lt;span&gt;Fetch / rebase&lt;/span&gt;&lt;strong&gt;${taskCompleted ? &#x27;Fetch szükséges · rebase nem várható&#x27; : &#x27;Nem szükséges&#x27;}&lt;/strong&gt;&lt;/li&gt;
            &lt;li class=&quot;cg-sync-row&quot;&gt;&lt;span&gt;Commit&lt;/span&gt;&lt;strong&gt;${taskCompleted ? &#x27;game(marcus): record week-01 progress&#x27; : &#x27;Nem készül commit&#x27;}&lt;/strong&gt;&lt;/li&gt;
            &lt;li class=&quot;cg-sync-row&quot;&gt;&lt;span&gt;Push cél&lt;/span&gt;&lt;strong&gt;origin/main&lt;/strong&gt;&lt;/li&gt;
            &lt;li class=&quot;cg-sync-row&quot;&gt;&lt;span&gt;Blokkolók&lt;/span&gt;&lt;strong&gt;Nincs&lt;/strong&gt;&lt;/li&gt;
          &lt;/ul&gt;
          &lt;div class=&quot;cg-drawer-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cg-button cg-button-primary cg-dryrun-close&quot;&gt;Rendben&lt;/button&gt;&lt;/div&gt;`));
        drawerContent.querySelector(&#x27;.cg-dryrun-close&#x27;).addEventListener(&#x27;click&#x27;, closeDrawer);
      };

      const openTeam = () =&gt; {
        openDrawer(drawerShell(&#x27;Legio III · közös állapot&#x27;, &#x27;A sereg ereje&#x27;, `
          &lt;p class=&quot;cg-copy&quot;&gt;A három parancsnok hozzájárulása együtt alakítja a következő összecsapás helyzetét.&lt;/p&gt;
          &lt;div class=&quot;cg-team-row&quot;&gt;&lt;strong&gt;&lt;span&gt;Marcus&lt;/span&gt;&lt;span&gt;${taskCompleted ? &#x27;6&#x27; : &#x27;5&#x27;} pont&lt;/span&gt;&lt;/strong&gt;&lt;div class=&quot;cg-meter&quot;&gt;&lt;span style=&quot;width:${taskCompleted ? &#x27;72&#x27; : &#x27;60&#x27;}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;cg-team-row&quot;&gt;&lt;strong&gt;&lt;span&gt;Livia&lt;/span&gt;&lt;span&gt;4 pont&lt;/span&gt;&lt;/strong&gt;&lt;div class=&quot;cg-meter&quot;&gt;&lt;span style=&quot;width:48%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;cg-team-row&quot;&gt;&lt;strong&gt;&lt;span&gt;Titus&lt;/span&gt;&lt;span&gt;5 pont&lt;/span&gt;&lt;/strong&gt;&lt;div class=&quot;cg-meter&quot;&gt;&lt;span style=&quot;width:60%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;cg-reward&quot;&gt;&lt;strong&gt;Következő mérföldkő&lt;/strong&gt;12/18 közös pont · Hágófelderítés&lt;/div&gt;`));
      };

      const openInfo = (kind) =&gt; {
        const content = {
          story: [&#x27;Hadjárati jelentés&#x27;, &#x27;A köd miatt a felderítők lassan haladnak. Egy teljesített napi vállalás felfedi a biztonságos ösvényt.&#x27;],
          scout: [&#x27;Felderítőjelentés&#x27;, &#x27;A keleti út gyorsabb, de több készletet igényel. Az útvonal a következő heti döntésnél válik aktívvá.&#x27;],
          locked: [&#x27;Künoszkephalai&#x27;, &#x27;A döntő csata a hetedik héten nyílik meg. A sereg állapotát az addig gyűjtött erőforrások határozzák meg.&#x27;],
          command: [&#x27;Heti eligazítás&#x27;, &#x27;Cél: érjétek el együtt a 18 pontot, hogy a hágófelderítés kedvező ágon induljon.&#x27;],
          store: [&#x27;Raktár&#x27;, &#x27;Commeatus: 6 · A készletek jelenleg elegendők. A következő fejlesztés 8 közös pontba kerül.&#x27;],
          scribe: [&#x27;Írnok&#x27;, &#x27;Nincs függőben lévő csapattársi vagy e-mailes igazolás. A helyi eseménynapló érvényes.&#x27;]
        };
        const selected = content[kind];
        openDrawer(drawerShell(&#x27;Tábori feljegyzés&#x27;, selected[0], `&lt;p class=&quot;cg-copy&quot;&gt;${selected[1]}&lt;/p&gt;`));
      };

      const setView = (view) =&gt; {
        panels.forEach((panel) =&gt; { panel.hidden = panel.dataset.panel !== view; });
        navButtons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.view === view)));
      };

      navButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        closeDrawer();
        setView(button.dataset.view);
      }));
      root.querySelectorAll(&#x27;[data-action]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (button.dataset.action === &#x27;task&#x27;) openTask();
        else openInfo(button.dataset.action);
      }));
      root.querySelector(&#x27;.cg-sync-button&#x27;).addEventListener(&#x27;click&#x27;, openSync);
      root.querySelector(&#x27;.cg-status-button&#x27;).addEventListener(&#x27;click&#x27;, openTeam);
      drawerBackdrop.addEventListener(&#x27;click&#x27;, closeDrawer);
      root.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;Escape&#x27; &amp;&amp; !drawer.hidden) closeDrawer();
      });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
