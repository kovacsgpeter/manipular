<div id="cynos-interview-01">
  <style>
    #cynos-interview-01 {
      --cyn-ink: light-dark(#29251f, #f2eadb);
      --cyn-muted: light-dark(#6f675c, #bcb09e);
      --cyn-paper: light-dark(#f7f0e2, #292721);
      --cyn-paper-2: light-dark(#fffaf0, #343129);
      --cyn-line: light-dark(#cfc1a7, #625b4e);
      --cyn-red: light-dark(#8d302b, #de756a);
      --cyn-red-soft: light-dark(#f0d8ce, #4a2925);
      --cyn-gold: light-dark(#b7862e, #d9ac55);
      color: var(--cyn-ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 100%;
    }

    #cynos-interview-01 * { box-sizing: border-box; }

    #cynos-interview-01 .cyn-shell {
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--cyn-gold) 9%, transparent) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--cyn-paper);
      border: 1px solid var(--cyn-line);
      border-radius: 18px;
      box-shadow: 0 16px 40px color-mix(in srgb, #000 14%, transparent);
      min-height: 490px;
      overflow: hidden;
    }

    #cynos-interview-01 .cyn-top {
      align-items: center;
      background: color-mix(in srgb, var(--cyn-paper-2) 92%, transparent);
      border-bottom: 1px solid var(--cyn-line);
      display: flex;
      gap: 16px;
      justify-content: space-between;
      padding: 18px 22px 15px;
    }

    #cynos-interview-01 .cyn-brand { min-width: 0; }
    #cynos-interview-01 .cyn-kicker {
      color: var(--cyn-red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    #cynos-interview-01 .cyn-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(19px, 4vw, 25px);
      font-weight: 700;
      line-height: 1.1;
    }

    #cynos-interview-01 .cyn-progress-label {
      color: var(--cyn-muted);
      flex: none;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    #cynos-interview-01 .cyn-progress {
      background: color-mix(in srgb, var(--cyn-line) 42%, transparent);
      height: 4px;
      position: relative;
    }

    #cynos-interview-01 .cyn-progress > span {
      background: linear-gradient(90deg, var(--cyn-red), var(--cyn-gold));
      display: block;
      height: 100%;
      transition: width .25s ease;
      width: 0;
    }

    #cynos-interview-01 .cyn-main {
      display: grid;
      gap: 22px;
      padding: clamp(22px, 5vw, 36px);
    }

    #cynos-interview-01 .cyn-stepmark {
      align-items: center;
      background: var(--cyn-red);
      border-radius: 50%;
      color: #fffaf0;
      display: flex;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-weight: 700;
      height: 36px;
      justify-content: center;
      width: 36px;
    }

    #cynos-interview-01 .cyn-question {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 4vw, 31px);
      line-height: 1.18;
      margin: 0;
      max-width: 720px;
    }

    #cynos-interview-01 .cyn-hint {
      color: var(--cyn-muted);
      font-size: 13px;
      line-height: 1.45;
      margin-top: -12px;
    }

    #cynos-interview-01 .cyn-options {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #cynos-interview-01 .cyn-option {
      align-items: center;
      background: color-mix(in srgb, var(--cyn-paper-2) 88%, transparent);
      border: 1px solid var(--cyn-line);
      border-radius: 12px;
      color: var(--cyn-ink);
      cursor: pointer;
      display: flex;
      font: inherit;
      gap: 12px;
      min-height: 58px;
      padding: 12px 14px;
      text-align: left;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
      width: 100%;
    }

    #cynos-interview-01 .cyn-option:hover {
      border-color: var(--cyn-gold);
      transform: translateY(-1px);
    }

    #cynos-interview-01 .cyn-option:focus-visible,
    #cynos-interview-01 button:focus-visible,
    #cynos-interview-01 textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--cyn-gold) 45%, transparent);
      outline-offset: 2px;
    }

    #cynos-interview-01 .cyn-option[aria-pressed="true"] {
      background: var(--cyn-red-soft);
      border-color: var(--cyn-red);
    }

    #cynos-interview-01 .cyn-glyph {
      align-items: center;
      border: 1px solid var(--cyn-line);
      border-radius: 50%;
      color: var(--cyn-muted);
      display: flex;
      flex: none;
      font-size: 11px;
      font-weight: 800;
      height: 24px;
      justify-content: center;
      width: 24px;
    }

    #cynos-interview-01 .cyn-option[aria-pressed="true"] .cyn-glyph {
      background: var(--cyn-red);
      border-color: var(--cyn-red);
      color: #fff;
    }

    #cynos-interview-01 .cyn-custom {
      display: none;
      margin-top: -10px;
    }

    #cynos-interview-01 .cyn-custom.is-visible { display: block; }

    #cynos-interview-01 textarea {
      background: var(--cyn-paper-2);
      border: 1px solid var(--cyn-line);
      border-radius: 10px;
      color: var(--cyn-ink);
      font: inherit;
      line-height: 1.45;
      min-height: 86px;
      padding: 12px;
      resize: vertical;
      width: 100%;
    }

    #cynos-interview-01 .cyn-export {
      margin-top: 14px;
      min-height: 240px;
    }

    #cynos-interview-01 .cyn-actions {
      align-items: center;
      border-top: 1px solid var(--cyn-line);
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-top: 2px;
      padding-top: 18px;
    }

    #cynos-interview-01 .cyn-action {
      border: 1px solid var(--cyn-line);
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      min-height: 42px;
      padding: 9px 16px;
    }

    #cynos-interview-01 .cyn-back {
      background: transparent;
      color: var(--cyn-ink);
    }

    #cynos-interview-01 .cyn-next,
    #cynos-interview-01 .cyn-send {
      background: var(--cyn-red);
      border-color: var(--cyn-red);
      color: #fffaf0;
    }

    #cynos-interview-01 .cyn-action:disabled {
      cursor: not-allowed;
      opacity: .4;
    }

    #cynos-interview-01 .cyn-error {
      color: var(--cyn-red);
      font-size: 12px;
      min-height: 18px;
    }

    #cynos-interview-01 .cyn-summary {
      display: grid;
      gap: 9px;
      margin: 0;
    }

    #cynos-interview-01 .cyn-summary-row {
      background: color-mix(in srgb, var(--cyn-paper-2) 88%, transparent);
      border-left: 3px solid var(--cyn-gold);
      padding: 10px 12px;
    }

    #cynos-interview-01 .cyn-summary-row dt {
      color: var(--cyn-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    #cynos-interview-01 .cyn-summary-row dd {
      font-size: 14px;
      line-height: 1.4;
      margin: 0;
    }

    #cynos-interview-01 .cyn-sent {
      color: var(--cyn-red);
      font-weight: 750;
      text-align: right;
    }

    @media (max-width: 620px) {
      #cynos-interview-01 .cyn-options { grid-template-columns: 1fr; }
      #cynos-interview-01 .cyn-shell { min-height: 570px; }
      #cynos-interview-01 .cyn-main { padding: 22px 18px; }
      #cynos-interview-01 .cyn-top { padding: 15px 18px 13px; }
      #cynos-interview-01 .cyn-title { font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #cynos-interview-01 * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>

  <section class="cyn-shell" aria-labelledby="cyn-title-01">
    <header class="cyn-top">
      <div class="cyn-brand">
        <div class="cyn-kicker">Haditanács · tizenharmadik interjú</div>
        <div class="cyn-title" id="cyn-title-01">Szerződések és scaffold-kapu</div>
      </div>
      <div class="cyn-progress-label" aria-live="polite"></div>
    </header>
    <div class="cyn-progress" aria-hidden="true"><span></span></div>
    <main class="cyn-main"></main>
  </section>

  <script>
    (() => {
      const root = document.getElementById('cynos-interview-01');
      const main = root.querySelector('.cyn-main');
      const progressLabel = root.querySelector('.cyn-progress-label');
      const progressBar = root.querySelector('.cyn-progress > span');
      const questions = [
        {
          title: 'Melyik workspace-eszközzel induljon a monorepo?',
          hint: 'Hat csomag körüli MVP-nél önmagában a workspace-kezelés is elég lehet külön build-orchestrator nélkül.',
          options: ['pnpm workspaces, külön orchestrator nélkül (Ajánlott MVP)', 'npm workspaces', 'pnpm workspaces + Turborepo az első naptól']
        },
        {
          title: 'Mik legyenek az induló workspace-package-ek?',
          hint: 'Az Electron main, preload és renderer együtt maradhat az appban, a környezetfüggetlen logika pedig külön csomagokba kerülhet.',
          options: ['apps/desktop + core, contracts, persistence, git-sync és email-verifier package-ek (Ajánlott)', 'Külön main, preload és renderer package, plusz minden megosztott csomag', 'Csak desktop és egyetlen shared package']
        },
        {
          title: 'Mivel írjuk le a megosztott futásidejű sémákat?',
          hint: 'Ugyanazokra a szerződésekre támaszkodhat a curriculum-, esemény- és IPC-validáció, valamint a TypeScript-típusozás.',
          options: ['TypeBox sémák + Ajv validáció (Ajánlott)', 'Zod az IPC-hez, külön kézzel írt JSON Schema a tartalomhoz', 'Kézzel írt validátorok külső sémakönyvtár nélkül']
        },
        {
          title: 'Milyen legyen az IPC-válaszok közös formája?',
          hint: 'A renderer így ugyanúgy kezelheti a sikert, a javítható hibát és a blokkoló állapotot minden műveletnél.',
          options: ['{ok,data} vagy {ok:false,error:{code,message,details,recoverable}} (Ajánlott)', 'Sikerérték vagy dobott szöveges Error', 'Numerikus hibakód és külön logfájl']
        },
        {
          title: 'Milyen formátumúak legyenek a generált azonosítók?',
          hint: 'Az időrendet külön occurredAt mező hordozhatja, ezért az azonosítónak elsősorban ütközésmentesnek kell lennie.',
          options: ['UUID v4 minden requestId, attemptId és eventId értékhez (Ajánlott MVP)', 'Időrendbe rendezhető ULID', 'Játékosazonosító + helyi számláló']
        },
        {
          title: 'Hogyan tároljuk az események időpontját?',
          hint: 'A határidőhöz a tényleges időpont kell, a felhasználói megjelenítéshez pedig hasznos az eredeti helyi eltolás.',
          options: ['ISO 8601 UTC occurredAt + külön timezoneOffsetMinutes (Ajánlott)', 'Csak a gép helyi időzónás szövege', 'Unix milliszekundum, időzóna-adat nélkül']
        },
        {
          title: 'Mi legyen minden játékesemény kötelező borítéka?',
          hint: 'A verziózott payload mellett a tartalomverzió és hash teszi determinisztikusan újraszámíthatóvá az állapotot.',
          options: ['schemaVersion, eventId, eventType, occurredAt, offset, actorId, campaignId, weekId, contentVersion, contentHash, payload (Ajánlott)', 'Csak eventType, playerId és payload', 'A teljes aktuális state minden eseményben']
        },
        {
          title: 'Hogyan írjuk a JSONL-eseményeket?',
          hint: 'A main folyamat sorosíthatja az írásokat, és csak a lemezre kényszerített append után jelezhet sikert.',
          options: ['Validálás → folyamaton belüli írási sor → egy UTF-8 sor append → fsync → visszaigazolás (Ajánlott)', 'A renderer közvetlenül írja a fájlt', 'Minden eseménynél a teljes JSONL-fájlt újraírjuk']
        },
        {
          title: 'Hogyan akadályozzuk meg a párhuzamos helyi írást?',
          hint: 'Két megnyitott alkalmazás ugyanahhoz a repohoz különben egyszerre appendelhetne.',
          options: ['Electron single-instance lock + repónkénti lock az app userData könyvtárban (Ajánlott)', 'Több példány engedett, az operációs rendszer appendjeire hagyatkozunk', 'A Git-repóban követett lockfájlt használunk']
        },
        {
          title: 'Mi történjen Sync előtt idegen, követett Git-módosításoknál?',
          hint: 'A pull vagy rebase nem garantálható biztonságosan egy más célból módosított munkafán anélkül, hogy a játék hozzányúlna ezekhez a fájlokhoz.',
          options: ['A helyi mentés maradjon aktív, de a Sync álljon meg; ne stash-eljen és ne módosítsa őket (Ajánlott)', 'Automatikus stash, Sync, majd stash-visszaállítás', 'Az app automatikusan hozzon létre külön rejtett Git-worktree-t']
        },
        {
          title: 'Milyen legyen a push-verseny újrapróbálása?',
          hint: 'A korábbi döntés szerint az átmeneti versenyhelyzet sikerig próbálható, de a felhasználónak meg kell tudnia szakítani.',
          options: ['Exponenciális 1–2–4… másodperc, legfeljebb 30 mp várakozás, megszakítható; permanens hibánál stop (Ajánlott)', 'Fix 1 másodperces végtelen ciklus megszakítás nélkül', 'Legfeljebb három teljes Sync-kísérlet']
        },
        {
          title: 'Mit adjon vissza a Sync dry-run?',
          hint: 'A tényleges Git-művelet előtt ugyanabból a tervből készülhet majd az előnézet és a végrehajtás.',
          options: ['Engedélyezett fájllista, validáció, fetch/rebase szükségesség, commitüzenet, push-cél és blokkolók (Ajánlott)', 'Csak a módosult fájlok száma', 'A teljes nyers Git-parancskimenet']
        },
        {
          title: 'Mikor ellenőrizzük a remote/auth állapotot?',
          hint: 'Az indulás ne várjon szükségtelenül hálózatra, de a felület időben jelezheti, hogy a Sync nem fog működni.',
          options: ['Indulás után aszinkron háttérellenőrzés, majd minden Sync előtt friss ellenőrzés (Ajánlott)', 'Blokkoló hálózati ellenőrzés minden induláskor', 'Csak a push hibájából derüljön ki']
        },
        {
          title: 'Milyen URL-t nyithasson meg az openReleasePage?',
          hint: 'A kampányfájl tartalma nem adhat tetszőleges protokollt vagy helyi fájlútvonalat a shellnek.',
          options: ['Csak HTTPS GitHub Releases URL a konfigurált repositoryhoz (Ajánlott MVP)', 'Bármilyen HTTPS URL', 'Bármilyen, az operációs rendszer által ismert URL-séma']
        },
        {
          title: 'Hol és hogyan tároljuk az app-beállításokat?',
          hint: 'A helyi kampányútvonal nem való a repóba, és az írás megszakadása sem hagyhat félig írt konfigurációt.',
          options: ['Electron userData/settings.json, temporális fájl + atomi csere; titok nélkül (Ajánlott)', 'A kampányrepo .env fájljában', 'A rendszer keychainjében minden beállítással együtt']
        },
        {
          title: 'Mit tároljon az első one_off teljesítési esemény?',
          hint: 'A jutalom az immutable curriculum verzióból újraszámítható, ezért nem feltétlenül kell kanonikus eredményként megismételni.',
          options: ['taskId és contentVersion/hash; a jutalmat a motor képezi le (Ajánlott)', 'taskId és a teljes kiszámított jutalom-snapshot', 'A teljes feladatdefiníció másolata az eseményben']
        },
        {
          title: 'Milyen CI-platformmátrix induljon?',
          hint: 'A gyors, olcsó ellenőrzések futhatnak minden változásnál, a csomagolt Electron smoke tesztek ritkábban mindkét célplatformon.',
          options: ['Unit + Git integráció minden pushnál; macOS/Windows Electron smoke a main ágon és release előtt (Ajánlott)', 'Minden teszt macOS-en és Windowson minden commitnál', 'Csak helyi tesztek, CI nélkül az MVP-ig']
        },
        {
          title: 'Mi legyen a következő lépés e kör lezárása után?',
          hint: 'A döntések után a koncepció már elegendő lehet az első függőleges szelet technikai elindításához.',
          options: ['Készítsük el a workspace-scaffoldot és az első szeletet (Ajánlott)', 'Előbb készüljön kattintható játékfelület-wireframe', 'Folytassuk csak a specifikáció részletezését']
        }
      ];
      const answers = Array(questions.length).fill(null);
      let step = 0;
      let sending = false;

      const escapeHtml = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      const answerValue = () => {
        const pressed = main.querySelector('.cyn-option[aria-pressed="true"]');
        if (!pressed) return null;
        if (pressed.dataset.custom === 'true') {
          const text = main.querySelector('textarea').value.trim();
          return text ? `Saját válasz: ${text}` : null;
        }
        return pressed.dataset.value;
      };

      const selectOption = (button) => {
        main.querySelectorAll('.cyn-option').forEach((item) => item.setAttribute('aria-pressed', 'false'));
        button.setAttribute('aria-pressed', 'true');
        const custom = main.querySelector('.cyn-custom');
        const isCustom = button.dataset.custom === 'true';
        custom.classList.toggle('is-visible', isCustom);
        const next = main.querySelector('.cyn-next');
        if (next) next.disabled = isCustom && !main.querySelector('textarea').value.trim();
        main.querySelector('.cyn-error').textContent = '';
        if (isCustom) main.querySelector('textarea').focus();
      };

      const renderQuestion = () => {
        const q = questions[step];
        const prior = answers[step];
        progressLabel.textContent = `${step + 1} / ${questions.length}`;
        progressBar.style.width = `${((step + 1) / questions.length) * 100}%`;
        const optionMarkup = q.options.map((option, index) => {
          const selected = prior === option;
          return `<button type="button" class="cyn-option" aria-pressed="${selected}" data-value="${escapeHtml(option)}"><span class="cyn-glyph">${String.fromCharCode(65 + index)}</span><span>${escapeHtml(option)}</span></button>`;
        }).join('');
        const customSelected = prior && prior.startsWith('Saját válasz: ');
        const customText = customSelected ? prior.slice('Saját válasz: '.length) : '';
        main.innerHTML = `
          <div class="cyn-stepmark" aria-hidden="true">${step + 1}</div>
          <h2 class="cyn-question">${escapeHtml(q.title)}</h2>
          <div class="cyn-hint">${escapeHtml(q.hint)}</div>
          <div class="cyn-options" role="group" aria-label="Válaszlehetőségek">
            ${optionMarkup}
            <button type="button" class="cyn-option" aria-pressed="${Boolean(customSelected)}" data-custom="true" data-value="custom"><span class="cyn-glyph">✎</span><span>Saját válasz</span></button>
          </div>
          <div class="cyn-custom ${customSelected ? 'is-visible' : ''}">
            <textarea maxlength="600" aria-label="Saját válasz" placeholder="Írd le röviden a saját elképzelésedet…">${escapeHtml(customText)}</textarea>
          </div>
          <div class="cyn-error" role="alert"></div>
          <div class="cyn-actions">
            <button type="button" class="cyn-action cyn-back" ${step === 0 ? 'disabled' : ''}>Vissza</button>
            <button type="button" class="cyn-action cyn-next" ${prior ? '' : 'disabled'}>${step === questions.length - 1 ? 'Összegzés' : 'Tovább'}</button>
          </div>`;
        main.querySelectorAll('.cyn-option').forEach((button) => button.addEventListener('click', () => selectOption(button)));
        const textarea = main.querySelector('textarea');
        textarea.addEventListener('input', () => {
          const next = main.querySelector('.cyn-next');
          if (main.querySelector('.cyn-option[data-custom="true"]').getAttribute('aria-pressed') === 'true') {
            next.disabled = !textarea.value.trim();
          }
        });
        main.querySelector('.cyn-back').addEventListener('click', () => {
          const current = answerValue();
          if (current) answers[step] = current;
          if (step > 0) { step -= 1; renderQuestion(); }
        });
        main.querySelector('.cyn-next').addEventListener('click', () => {
          const value = answerValue();
          if (!value) {
            main.querySelector('.cyn-error').textContent = 'Válassz egy lehetőséget, vagy írd be a saját válaszodat.';
            return;
          }
          answers[step] = value;
          if (step < questions.length - 1) { step += 1; renderQuestion(); }
          else renderSummary();
        });
      };

      const renderSummary = () => {
        progressLabel.textContent = 'Összegzés';
        progressBar.style.width = '100%';
        const rows = questions.map((q, index) => `
          <div class="cyn-summary-row">
            <dt>${index + 1}. ${escapeHtml(q.title)}</dt>
            <dd>${escapeHtml(answers[index])}</dd>
          </div>`).join('');
        main.innerHTML = `
          <div class="cyn-stepmark" aria-hidden="true">✓</div>
          <h2 class="cyn-question">Haditanácsi összegzés</h2>
          <div class="cyn-hint">Ellenőrizd a válaszokat, majd készítsd elő a kimásolható összegzést.</div>
          <dl class="cyn-summary">${rows}</dl>
          <div class="cyn-sent" aria-live="polite"></div>
          <div class="cyn-actions">
            <button type="button" class="cyn-action cyn-back">Válaszok módosítása</button>
            <button type="button" class="cyn-action cyn-send">Válaszok előkészítése</button>
          </div>`;
        main.querySelector('.cyn-back').addEventListener('click', () => {
          step = questions.length - 1;
          renderQuestion();
        });
        main.querySelector('.cyn-send').addEventListener('click', sendAnswers);
      };

      const sendAnswers = async () => {
        if (sending) return;
        sending = true;
        const button = main.querySelector('.cyn-send');
        const sent = main.querySelector('.cyn-sent');
        const summary = questions.map((q, index) => `${index + 1}. ${q.title}\nVálasz: ${answers[index]}`).join('\n\n');
        const prompt = `A tizenharmadik koncepcióinterjú válaszai:\n\n${summary}\n\nKérlek, építsd be ezeket a repóban lévő koncepció- és tervdokumentumba, jelezd a következtetéseidet, majd a 18. válaszom alapján hajtsd végre vagy készítsd elő a következő lépést.`;
        let exportBox = main.querySelector('.cyn-export');
        if (!exportBox) {
          exportBox = document.createElement('textarea');
          exportBox.className = 'cyn-export';
          exportBox.setAttribute('aria-label', 'Kimásolható interjúválaszok');
          exportBox.rows = 14;
          main.querySelector('.cyn-summary').after(exportBox);
        }
        exportBox.value = prompt;
        exportBox.focus();
        exportBox.select();
        try {
          await navigator.clipboard.writeText(prompt);
          sent.textContent = 'A válaszokat a vágólapra másoltuk.';
        } catch {
          sent.textContent = 'A válaszok kijelölve; másold ki őket, és illeszd be a beszélgetésbe.';
        }
        button.textContent = 'Válaszok kijelölése';
        button.disabled = false;
        sending = false;
      };

      renderQuestion();
    })();
  </script>
</div>
